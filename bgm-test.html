<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ead4a8"><title>朝パズル BGMテスト</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ead4a8;color:#3e2a19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.card{width:min(92vw,430px);background:#fff8e8;border:1px solid #caa978;border-radius:22px;padding:24px;text-align:center;box-shadow:0 12px 35px #5b3c1d22}h1{font-size:22px;margin:0 0 8px}p{font-size:13px;line-height:1.6;opacity:.8}button{width:100%;border:1px solid #b58b55;border-radius:14px;padding:15px;background:#719766;color:white;font-size:17px;font-weight:800;margin-top:8px}.small{font-size:11px;opacity:.6;margin-top:12px}</style></head><body><div class="card"><h1>🌅 朝の冒険 BGM</h1><p>外部音源なし・無料。<br>ピアノ風→広がり→疾走感→朝のサビ、という流れのテスト版です。</p><button id="play">▶ BGMを聴く</button><div class="small" id="status">iPhoneはボタンを押した時に音が始まります</div></div><script>
let ac,master,on=false,timer=null,nodes=[];const BPM=108,B=60/BPM,BAR=B*4,BARS=32,LOOP=BAR*BARS;
const N={C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196,A3:220,B3:246.94,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,G5:783.99};
function init(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.58;let comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;master.connect(comp);comp.connect(ac.destination)}function keep(x){nodes.push(x);x.onended=()=>nodes.splice(nodes.indexOf(x),1)}
function tone(f,t,d,v=.05,type='triangle',det=0){let o=ac.createOscillator(),a=ac.createGain(),now=ac.currentTime+t;o.type=type;o.frequency.value=f;o.detune.value=det;a.gain.setValueAtTime(.0001,now);a.gain.exponentialRampToValueAtTime(v,now+.018);a.gain.exponentialRampToValueAtTime(Math.max(.0001,v*.55),now+Math.max(.06,d*.7));a.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(a);a.connect(master);keep(o);o.start(now);o.stop(now+d+.03)}
function piano(f,t,d,v=.05){tone(f,t,d,v,'triangle');tone(f*2,t+.006,d*.45,v*.13,'sine')}function pad(fs,t,d,v=.025){fs.forEach((f,i)=>{tone(f,t,d,v,'sine',(i-1)*4);tone(f*2,t+.02,d*.92,v*.12,'triangle')})}
function kick(t,v=.11){let o=ac.createOscillator(),a=ac.createGain(),n=ac.currentTime+t;o.frequency.setValueAtTime(90,n);o.frequency.exponentialRampToValueAtTime(44,n+.18);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.0001,n+.3);o.connect(a);a.connect(master);keep(o);o.start(n);o.stop(n+.31)}
function hat(t,v=.018){let len=(ac.sampleRate*.045)|0,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);let s=ac.createBufferSource(),f=ac.createBiquadFilter(),a=ac.createGain();f.type='highpass';f.frequency.value=6000;a.gain.value=v;s.buffer=b;s.connect(f);f.connect(a);a.connect(master);keep(s);s.start(ac.currentTime+t)}
const prog=[[N.C3,N.E3,N.G3],[N.G3,N.B3,N.D4],[N.A3,N.C4,N.E4],[N.F3,N.A3,N.C4],[N.C3,N.E3,N.G3],[N.G3,N.B3,N.D4],[N.F3,N.A3,N.C4],[N.G3,N.B3,N.D4]];
const melody=[N.E4,N.G4,N.A4,N.G4,N.E4,N.D4,N.C4,N.D4,N.E4,N.G4,N.C5,N.B4,N.A4,N.G4,N.E4,N.G4,N.A4,N.C5,N.D5,N.C5,N.A4,N.G4,N.E4,N.D4,N.E4,N.G4,N.A4,N.G4,N.E4,N.D4,N.C4,N.G4];
function schedule(){if(!on)return;for(let bar=0;bar<BARS;bar++){let t=bar*BAR,ch=prog[bar%8],section=Math.floor(bar/8);pad(ch,t,BAR*.96,section===0?.016:section===3?.032:.025);if(section===0){for(let k=0;k<4;k++)piano(ch[k%3]*2,t+k*B,B*.72,.025)}else{for(let k=0;k<8;k++)piano(ch[k%3]*2,t+k*B/2,B*.36,section===3?.026:.021);kick(t,section===3?.13:.09);kick(t+2*B,section===3?.10:.07);for(let k=0;k<8;k++)hat(t+(k+.5)*B/2,section===3?.024:.015)}let m=melody[bar];if(section===0){if(bar%2===0)piano(m,t+B,B*1.5,.035)}else{piano(m,t+B*.5,B*.7,section===3?.065:.048);piano(bar%4===3?m*1.122:m*1.5,t+B*2,B*.8,section===3?.052:.04);if(section===3)piano(m*2,t+B*3,B*.6,.028)}}}
function stop(){clearTimeout(timer);timer=null;nodes.splice(0).forEach(n=>{try{n.stop(0)}catch(e){}})}function start(){stop();schedule();timer=setTimeout(function again(){if(!on)return;schedule();timer=setTimeout(again,LOOP*1000)},LOOP*1000)}
document.getElementById('play').onclick=async()=>{init();await ac.resume();on=!on;if(on){start();play.textContent='■ BGMを止める';status.textContent='再生中：朝→旅→疾走→サビ風に展開します'}else{stop();play.textContent='▶ BGMを聴く';status.textContent='停止しました'}};
</script></body></html>
