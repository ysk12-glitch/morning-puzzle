<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ead4a8"><title>朝の木工パズル</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#ead4a8;color:#3e2a19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}main{max-width:520px;height:100%;margin:auto;display:flex;flex-direction:column;min-height:0}.top{display:flex;align-items:center;justify-content:space-between;padding:2px 3px}.top h1{font-size:18px;margin:0}.sub{font-size:9px;opacity:.65}.stats,.row{display:flex;gap:4px}.pill{background:#fff8e8;border:1px solid #caa978;border-radius:11px;padding:4px 6px;font-weight:700;font-size:11px}.row{margin:2px 0}.row button{flex:1}button{font:inherit;border:1px solid #b58b55;background:#fff8e8;color:#3e2a19;border-radius:9px;padding:5px 2px;font-weight:700;font-size:11px;min-height:30px}.on{background:#719766!important;color:#fff!important}.board{flex:1;min-height:0;margin-top:2px;display:flex}canvas{display:block;width:100%;height:100%;background:#e6c483;border:2px solid #906b3f;border-radius:14px;touch-action:none}.help{text-align:center;font-size:9px;opacity:.7;margin:2px}.overlay{position:fixed;inset:0;background:#20150dbb;display:none;align-items:center;justify-content:center;padding:25px;z-index:10}.card{background:#fff8e8;border-radius:20px;padding:22px;text-align:center;max-width:330px;width:100%}.big{font-size:18px;font-weight:800;margin:10px;white-space:pre-line}.fact{font-size:12px;line-height:1.5;margin:8px}.card button{width:100%;background:#719766;color:#fff}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#3e2a19;color:#fff8e8;padding:9px 13px;border-radius:13px;font-weight:800;opacity:0;pointer-events:none;z-index:20}.toast.show{opacity:1}</style></head><body><main><div class="top"><div><h1>🧩 朝の木工パズル</h1><div class="sub" id="sub">1枚を切って、元に戻す</div></div><div class="stats"><span class="pill" id="time">0:00</span><span class="pill" id="moves">0手</span></div></div><div class="row"><button data-mode="shape" class="on">🪵 シルエット</button><button data-mode="photo">🌍 世界の風景</button><button id="sound">🔊 BGM</button></div><div class="row"><button data-d="easy">やさしい</button><button data-d="normal" class="on">ふつう</button><button data-d="hard">むずかしい</button></div><div class="row"><button id="new">🎲 新しい問題</button><button id="reset">↩︎ リセット</button><button id="hint">💡 ヒント</button></div><div class="board"><canvas id="c" width="720" height="820"></canvas></div><div class="help">指で移動・タップで45°回転。BGMはオリジナルの冒険ドラマ風。</div></main><div class="overlay" id="ov"><div class="card"><h2>完成！🎉</h2><div class="big" id="result"></div><div class="fact" id="fact"></div><button id="again">もう1問いく</button></div></div><div class="toast" id="toast"></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let diff='normal',mode='shape',pieces=[],drag=null,moves=0,start=0,timer,current,initial=[],hintStage=0,lastKey='',audio=null,bgmOn=false,bgmTimer=null;
const SHAPES={fish:{name:'サカナ',emoji:'🐟',outline:[[125,240],[205,175],[345,155],[470,205],[565,145],[535,240],[565,335],[470,275],[345,325],[205,305]],colors:['#2f7185','#438fa3','#64aebd','#89c7ce','#376b82','#6bb3c0','#9bd4d8']},house:{name:'おうち',emoji:'🏠',outline:[[145,255],[330,105],[515,255],[485,255],[485,410],[175,410],[175,255]],colors:['#a34f3b','#c56748','#df8b5d','#edb17b','#9a6847','#c9875c','#e0a477']},fox:{name:'キツネ',emoji:'🦊',outline:[[180,130],[260,190],[330,165],[400,190],[480,130],[455,270],[405,365],[330,410],[255,365],[205,270]],colors:['#a94f2e','#c46136','#db7841','#eb9658','#f0b477','#8e4932','#bc653e']},boat:{name:'ヨット',emoji:'⛵',outline:[[165,300],[310,300],[310,120],[455,300],[535,300],[485,370],[205,370]],colors:['#4f87a2','#6ba5bb','#91c4d1','#d4a05d','#b87843','#e3b878','#7297a5']}};
const PHOTOS=[{key:'machu',name:'マチュ・ピチュ',emoji:'🇵🇪',fact:'ペルーのアンデス山中に残るインカ帝国の遺跡。標高約2,430mにあります。',url:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Machu_Picchu_and_Waynapicchu_(Landscape).jpg?width=1000'},{key:'earth',name:'砂漠の夕景',emoji:'🏜️',fact:'写真が読み込めない時も遊べる、ゲーム内生成の風景です。',generated:true},{key:'aurora',name:'北のオーロラ',emoji:'🌌',fact:'空の模様もピース位置を考える手掛かりになります。',generated:true}];
function path(poly){g.beginPath();g.moveTo(poly[0][0],poly[0][1]);for(let i=1;i<poly.length;i++)g.lineTo(poly[i][0],poly[i][1]);g.closePath()}function sa(p){let a=0;for(let i=0;i<p.length;i++){let q=p[i],r=p[(i+1)%p.length];a+=q[0]*r[1]-r[0]*q[1]}return a/2}function area(p){return Math.abs(sa(p))}function cen(p){let A=sa(p),x=0,y=0;if(Math.abs(A)<1)return p.reduce((s,q)=>[s[0]+q[0]/p.length,s[1]+q[1]/p.length],[0,0]);for(let i=0;i<p.length;i++){let q=p[i],r=p[(i+1)%p.length],k=q[0]*r[1]-r[0]*q[1];x+=(q[0]+r[0])*k;y+=(q[1]+r[1])*k}return[x/(6*A),y/(6*A)]}function inside(p,x,y){let z=false;for(let i=0,j=p.length-1;i<p.length;j=i++){let a=p[i],b=p[j];if(((a[1]>y)!=(b[1]>y))&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])z=!z}return z}function lerp(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}function bounds(p){return{minX:Math.min(...p.map(q=>q[0])),maxX:Math.max(...p.map(q=>q[0])),minY:Math.min(...p.map(q=>q[1])),maxY:Math.max(...p.map(q=>q[1]))}}function dims(p){let b=bounds(p);return[b.maxX-b.minX,b.maxY-b.minY]}
function split(poly,total,count){let n=poly.length,best=null,score=1e9;for(let t=0;t<240;t++){let i=Math.floor(Math.random()*n),j=Math.floor(Math.random()*n);if(i===j||((i+1)%n)===j||((j+1)%n)===i)continue;let A=lerp(poly[i],poly[(i+1)%n],.25+Math.random()*.5),B=lerp(poly[j],poly[(j+1)%n],.25+Math.random()*.5),ok=true;for(let s=1;s<18;s++){let q=lerp(A,B,s/18);if(!inside(poly,q[0],q[1])){ok=false;break}}if(!ok)continue;let p1=[A],k=(i+1)%n,guard=0;while(k!==(j+1)%n&&guard++<n+2){p1.push(poly[k]);k=(k+1)%n}p1.push(B);let p2=[B];k=(j+1)%n;guard=0;while(k!==(i+1)%n&&guard++<n+2){p2.push(poly[k]);k=(k+1)%n}p2.push(A);let a1=area(p1),a2=area(p2),ideal=total/count,[w1,h1]=dims(p1),[w2,h2]=dims(p2),r1=Math.max(w1,h1)/Math.max(1,Math.min(w1,h1)),r2=Math.max(w2,h2)/Math.max(1,Math.min(w2,h2));if(Math.min(a1,a2)<ideal*.42||Math.min(w1,h1)<42||Math.min(w2,h2)<42||r1>3.4||r2>3.4)continue;let sc=Math.abs(a1-a2)/(a1+a2)+(r1+r2)*.05;if(sc<score){score=sc;best=[p1,p2]}}return best}function cut(outline,count){let total=area(outline);for(let a=0;a<100;a++){let parts=[outline.map(q=>[...q])];while(parts.length<count){let ids=parts.map((p,i)=>[area(p),i]).sort((x,y)=>y[0]-x[0]),done=false;for(const [,i] of ids){let s=split(parts[i],total,count);if(s){parts.splice(i,1,...s);done=true;break}}if(!done)break}if(parts.length===count&&Math.abs(parts.reduce((s,p)=>s+area(p),0)-total)<1)return parts}return null}
function photoOutline(){return[[130,125],[590,125],[590,390],[130,390]]}function choose(){let list=mode==='shape'?Object.keys(SHAPES):PHOTOS.map(x=>x.key),choices=list.filter(x=>x!==lastKey);let key=choices[Math.floor(Math.random()*choices.length)];lastKey=key;if(mode==='shape')return{...SHAPES[key],key,type:'shape'};let p=PHOTOS.find(x=>x.key===key);return{...p,outline:photoOutline(),type:'photo',colors:['#7c9c9b','#a87852','#5d7888','#d0a66f','#6b8b72','#9d7658','#7896a5']}}
function make(){let s=choose(),count=diff==='easy'?5:diff==='normal'?7:9,parts=cut(s.outline,count);if(!parts){setTimeout(make,0);return}current=s;if(s.type==='photo')preparePhoto(s);pieces=parts.map((poly,i)=>{let cc=cen(poly);return{local:poly.map(q=>[q[0]-cc[0],q[1]-cc[1]]),target:cc,x:0,y:0,angle:0,col:s.colors[i%s.colors.length],placed:false,hint:false}});if(!layout()){setTimeout(make,0);return}restart();draw()}
function preparePhoto(s){s.img=null;if(s.generated)return;let im=new Image;im.crossOrigin='anonymous';im.onload=()=>{s.img=im;draw()};im.onerror=()=>{s.generated=true;draw()};im.src=s.url}function trans(p){let a=p.angle*Math.PI/180,cs=Math.cos(a),sn=Math.sin(a);return p.local.map(q=>[p.x+q[0]*cs-q[1]*sn,p.y+q[0]*sn+q[1]*cs])}function overlap(a,b,p=5){return !(a.maxX+p<b.minX||b.maxX+p<a.minX||a.maxY+p<b.minY||b.maxY+p<a.minY)}function layout(){let used=[];for(const p of pieces){let ok=false;for(let t=0;t<300;t++){p.angle=Math.floor(Math.random()*8)*45;p.x=55+Math.random()*610;p.y=500+Math.random()*270;let b=bounds(trans(p));if(b.minX<12||b.maxX>708||b.minY<455||b.maxY>808||used.some(u=>overlap(b,u)))continue;used.push(b);ok=true;break}if(!ok)return false}initial=pieces.map(p=>({x:p.x,y:p.y,angle:p.angle}));return true}
function restart(){clearInterval(timer);start=Date.now();moves=0;hintStage=0;document.getElementById('moves').textContent='0手';document.getElementById('time').textContent='0:00';document.getElementById('ov').style.display='none';timer=setInterval(()=>{let s=Math.floor((Date.now()-start)/1000);document.getElementById('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}function drawScene(ctx,kind,x,y,w,h){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();let gr=ctx.createLinearGradient(0,y,0,y+h);if(kind==='aurora'){gr.addColorStop(0,'#10233c');gr.addColorStop(.55,'#275f68');gr.addColorStop(1,'#14271f')}else{gr.addColorStop(0,'#d89055');gr.addColorStop(.5,'#e8b86f');gr.addColorStop(1,'#8a553a')}ctx.fillStyle=gr;ctx.fillRect(x,y,w,h);ctx.globalAlpha=.75;for(let i=0;i<5;i++){ctx.fillStyle=kind==='aurora'?`rgba(${80+i*20},${190+i*8},${150+i*12},.45)`:'#65422f';ctx.beginPath();ctx.moveTo(x-20,y+h);ctx.lineTo(x+w*(.15+i*.2),y+h*(.35+i*.07));ctx.lineTo(x+w*(.38+i*.15),y+h);ctx.fill()}ctx.restore()}
function drawPhotoAtTarget(){let o=current.outline,b=bounds(o);g.save();path(o);g.clip();if(current.img)g.drawImage(current.img,b.minX,b.minY,b.maxX-b.minX,b.maxY-b.minY);else drawScene(g,current.key,b.minX,b.minY,b.maxX-b.minX,b.maxY-b.minY);g.restore()}function draw(){g.clearRect(0,0,720,820);g.fillStyle='#6f4e2f';g.font='bold 22px -apple-system';g.textAlign='center';g.fillText(current.emoji+' '+current.name+(current.type==='shape'?' のシルエット':''),360,40);g.textAlign='start';path(current.outline);if(current.type==='photo'){g.save();g.globalAlpha=.18;drawPhotoAtTarget();g.restore()}else{g.fillStyle='#f8ead0';g.fill()}g.strokeStyle='#755333';g.lineWidth=7;g.stroke();for(const p of pieces)paint(p);for(const p of pieces.filter(x=>x.hint)){let ghost={...p,x:p.target[0],y:p.target[1],angle:0};g.save();g.globalAlpha=.35;path(trans(ghost));g.fillStyle='#fff6a8';g.fill();g.restore()}}
function paint(p){let poly=trans(p);g.save();path(poly);g.clip();if(current.type==='photo'){let a=p.angle*Math.PI/180;g.translate(p.x,p.y);g.rotate(a);g.translate(-p.target[0],-p.target[1]);let b=bounds(current.outline);if(current.img)g.drawImage(current.img,b.minX,b.minY,b.maxX-b.minX,b.maxY-b.minY);else drawScene(g,current.key,b.minX,b.minY,b.maxX-b.minX,b.maxY-b.minY)}else{g.fillStyle=p.col;g.fillRect(0,0,720,820)}g.restore();path(poly);g.strokeStyle='#654527';g.lineWidth=4;g.stroke()}
function pt(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*720/r.width,(e.clientY-r.top)*820/r.height]}function seg(px,py,a,b){let vx=b[0]-a[0],vy=b[1]-a[1],wx=px-a[0],wy=py-a[1],v=vx*vx+vy*vy,t=v?Math.max(0,Math.min(1,(wx*vx+wy*vy)/v)):0;return Math.hypot(px-a[0]-t*vx,py-a[1]-t*vy)}function hit(p,x,y){let q=trans(p);if(inside(q,x,y))return true;for(let i=0;i<q.length;i++)if(seg(x,y,q[i],q[(i+1)%q.length])<30)return true;return false}c.onpointerdown=e=>{e.preventDefault();let[x,y]=pt(e);for(let i=pieces.length-1;i>=0;i--){let p=pieces[i];if(hit(p,x,y)){p.placed=false;p.hint=false;pieces.splice(i,1);pieces.push(p);drag={p,dx:x-p.x,dy:y-p.y,sx:x,sy:y,m:false};c.setPointerCapture?.(e.pointerId);draw();break}}};c.onpointermove=e=>{if(!drag)return;e.preventDefault();let[x,y]=pt(e);if(Math.hypot(x-drag.sx,y-drag.sy)>10)drag.m=true;drag.p.x=x-drag.dx;drag.p.y=y-drag.dy;draw()};c.onpointerup=e=>{if(!drag)return;let p=drag.p;if(!drag.m)p.angle=(p.angle+45)%360;else snap(p);moves++;document.getElementById('moves').textContent=moves+'手';drag=null;draw();check()};function snap(p){let d=Math.hypot(p.x-p.target[0],p.y-p.target[1]),a=Math.min((p.angle+360)%360,360-(p.angle+360)%360),tol=diff==='easy'?28:diff==='normal'?22:18;if(d<tol&&a<8){p.x=p.target[0];p.y=p.target[1];p.angle=0;p.placed=true;navigator.vibrate?.(15)}}function check(){if(!pieces.every(p=>p.placed))return;clearInterval(timer);let s=Math.floor((Date.now()-start)/1000);document.getElementById('result').textContent=current.emoji+' '+current.name+'\n'+Math.floor(s/60)+'分'+s%60+'秒・'+moves+'手';document.getElementById('fact').textContent=current.fact||'';document.getElementById('ov').style.display='flex';chime()}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}document.getElementById('hint').onclick=()=>{let p=pieces.find(x=>!x.placed);if(!p)return;p.hint=true;toast('💡 この辺り');draw()};document.getElementById('reset').onclick=()=>{pieces.forEach((p,i)=>Object.assign(p,initial[i],{placed:false,hint:false}));restart();draw()};document.getElementById('new').onclick=make;document.getElementById('again').onclick=make;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-d]').forEach(x=>x.classList.remove('on'));b.classList.add('on');diff=b.dataset.d;make()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;document.getElementById('sub').textContent=mode==='photo'?'世界の風景をバラして、元に戻す':'1枚を切って、元に戻す';lastKey='';make()});
function ensureAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)()}function tone(f,t,d,v=.035,type='sine'){let o=audio.createOscillator(),a=audio.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(0,audio.currentTime+t);a.gain.linearRampToValueAtTime(v,audio.currentTime+t+.03);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+t+d);o.connect(a);a.connect(audio.destination);o.start(audio.currentTime+t);o.stop(audio.currentTime+t+d+.05)}function phrase(){if(!bgmOn)return;ensureAudio();let root=[110,110,123.47,98][Math.floor(Math.random()*4)];tone(root,0,1.8,.028,'triangle');tone(root*1.5,.55,.7,.018,'sine');tone(root*2,.95,.8,.015,'sine');tone(root*.5,0,1.6,.018,'sine')}function toggleBgm(){ensureAudio();audio.resume();bgmOn=!bgmOn;document.getElementById('sound').textContent=bgmOn?'🔊 BGM':'🔇 BGM';clearInterval(bgmTimer);if(bgmOn){phrase();bgmTimer=setInterval(phrase,2200)}}function chime(){if(!bgmOn||!audio)return;tone(220,0,.4,.03,'triangle');tone(330,.18,.5,.03,'triangle');tone(440,.38,.8,.035,'triangle')}document.getElementById('sound').onclick=toggleBgm;make();</script></body></html>
