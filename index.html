<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ead4a8"><title>朝の木工パズル</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#ead4a8;color:#3e2a19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}main{max-width:520px;height:100%;margin:auto;display:flex;flex-direction:column;min-height:0}.top{display:flex;align-items:center;justify-content:space-between;padding:2px 3px}.top h1{font-size:18px;margin:0}.sub{font-size:9px;opacity:.65}.stats,.row{display:flex;gap:4px}.pill{background:#fff8e8;border:1px solid #caa978;border-radius:11px;padding:4px 6px;font-weight:700;font-size:11px}.row{margin:2px 0}.row button{flex:1}button{font:inherit;border:1px solid #b58b55;background:#fff8e8;color:#3e2a19;border-radius:9px;padding:5px 2px;font-weight:700;font-size:11px;min-height:30px}.on{background:#719766!important;color:#fff!important}.board{flex:1;min-height:0;margin-top:2px;display:flex}canvas{display:block;width:100%;height:100%;background:#e6c483;border:2px solid #906b3f;border-radius:14px;touch-action:none}.help{text-align:center;font-size:9px;opacity:.7;margin:2px}.overlay{position:fixed;inset:0;background:#20150dbb;display:none;align-items:center;justify-content:center;padding:25px;z-index:10}.card{background:#fff8e8;border-radius:20px;padding:22px;text-align:center;max-width:330px;width:100%}.big{font-size:18px;font-weight:800;margin:10px;white-space:pre-line}.fact{font-size:12px;line-height:1.5;margin:8px}.card button{width:100%;background:#719766;color:#fff}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#3e2a19;color:#fff8e8;padding:9px 13px;border-radius:13px;font-weight:800;opacity:0;pointer-events:none;z-index:20}.toast.show{opacity:1}</style></head><body><main><div class="top"><div><h1>🧩 朝の木工パズル</h1><div class="sub" id="sub">1枚を切って、元に戻す</div></div><div class="stats"><span class="pill" id="time">0:00</span><span class="pill" id="moves">0手</span></div></div><div class="row"><button data-mode="shape" class="on">🪵 シルエット</button><button data-mode="photo">🌍 世界の風景</button><button id="sound">🔊 BGM</button></div><div class="row"><button data-d="easy">やさしい</button><button data-d="normal" class="on">ふつう</button><button data-d="hard">むずかしい</button></div><div class="row"><button id="new">🎲 新しい問題</button><button id="reset">↩︎ リセット</button><button id="hint">💡 ヒント</button></div><div class="board"><canvas id="c" width="720" height="820"></canvas></div><div class="help">指で移動・タップで45°回転。BGMはオリジナルの冒険ドラマ風。</div></main><div class="overlay" id="ov"><div class="card"><h2>完成！🎉</h2><div class="big" id="result"></div><div class="fact" id="fact"></div><button id="again">もう1問いく</button></div></div><div class="toast" id="toast"></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let diff='normal',mode='shape',pieces=[],drag=null,moves=0,start=0,timer,current,initial=[],last={shape:'',photo:''},audio,bgmOn=false,bgmTimer;
const SHAPES={fish:{name:'サカナ',emoji:'🐟',o:[[125,240],[205,175],[345,155],[470,205],[565,145],[535,240],[565,335],[470,275],[345,325],[205,305]],cs:['#2f7185','#438fa3','#64aebd','#89c7ce','#376b82','#6bb3c0','#9bd4d8']},house:{name:'おうち',emoji:'🏠',o:[[145,255],[330,105],[515,255],[485,255],[485,410],[175,410],[175,255]],cs:['#a34f3b','#c56748','#df8b5d','#edb17b','#9a6847','#c9875c','#e0a477']},fox:{name:'キツネ',emoji:'🦊',o:[[180,130],[260,190],[330,165],[400,190],[480,130],[455,270],[405,365],[330,410],[255,365],[205,270]],cs:['#a94f2e','#c46136','#db7841','#eb9658','#f0b477','#8e4932','#bc653e']},boat:{name:'ヨット',emoji:'⛵',o:[[165,300],[310,300],[310,120],[455,300],[535,300],[485,370],[205,370]],cs:['#4f87a2','#6ba5bb','#91c4d1','#d4a05d','#b87843','#e3b878','#7297a5']}};
const PHOTOS=[{key:'machu',name:'マチュ・ピチュ',emoji:'🇵🇪',fact:'ペルーのアンデス山中に残るインカ帝国の遺跡。',scene:'machu'},{key:'fuji',name:'富士山',emoji:'🇯🇵',fact:'富士山は2013年に世界文化遺産に登録されました。',scene:'fuji'},{key:'desert',name:'砂漠の夕景',emoji:'🏜️',fact:'夕焼けの砂丘をイメージした風景です。',scene:'desert'},{key:'aurora',name:'北のオーロラ',emoji:'🌌',fact:'夜空の色の違いもピース位置の手掛かりです。',scene:'aurora'}];
function path(p){g.beginPath();g.moveTo(...p[0]);for(let i=1;i<p.length;i++)g.lineTo(...p[i]);g.closePath()}function sa(p){let a=0;for(let i=0;i<p.length;i++){let q=p[i],r=p[(i+1)%p.length];a+=q[0]*r[1]-r[0]*q[1]}return a/2}function area(p){return Math.abs(sa(p))}function cen(p){let A=sa(p),x=0,y=0;for(let i=0;i<p.length;i++){let q=p[i],r=p[(i+1)%p.length],k=q[0]*r[1]-r[0]*q[1];x+=(q[0]+r[0])*k;y+=(q[1]+r[1])*k}return Math.abs(A)<1?[0,0]:[x/(6*A),y/(6*A)]}function inside(p,x,y){let z=false;for(let i=0,j=p.length-1;i<p.length;j=i++){let a=p[i],b=p[j];if(((a[1]>y)!=(b[1]>y))&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])z=!z}return z}function lerp(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}function bounds(p){return{minX:Math.min(...p.map(q=>q[0])),maxX:Math.max(...p.map(q=>q[0])),minY:Math.min(...p.map(q=>q[1])),maxY:Math.max(...p.map(q=>q[1]))}}function dims(p){let b=bounds(p);return[b.maxX-b.minX,b.maxY-b.minY]}function minEdge(p){let m=1e9;for(let i=0;i<p.length;i++)m=Math.min(m,Math.hypot(p[i][0]-p[(i+1)%p.length][0],p[i][1]-p[(i+1)%p.length][1]));return m}function minAngle(p){let m=180;for(let i=0;i<p.length;i++){let a=p[(i-1+p.length)%p.length],b=p[i],d=p[(i+1)%p.length],u=[a[0]-b[0],a[1]-b[1]],v=[d[0]-b[0],d[1]-b[1]],co=(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v));m=Math.min(m,Math.acos(Math.max(-1,Math.min(1,co)))*180/Math.PI)}return m}function good(p,ideal){let[w,h]=dims(p),mn=Math.min(w,h),mx=Math.max(w,h),A=area(p);return A>ideal*.55&&A<ideal*1.7&&mn>58&&mx/mn<2.7&&minEdge(p)>30&&minAngle(p)>24}
function split(poly,total,n){let best=null,bs=1e9,ideal=total/n;for(let t=0;t<350;t++){let i=Math.floor(Math.random()*poly.length),j=Math.floor(Math.random()*poly.length);if(i===j||((i+1)%poly.length)===j||((j+1)%poly.length)===i)continue;let A=lerp(poly[i],poly[(i+1)%poly.length],.32+Math.random()*.36),B=lerp(poly[j],poly[(j+1)%poly.length],.32+Math.random()*.36),ok=true;for(let s=1;s<20;s++){let q=lerp(A,B,s/20);if(!inside(poly,...q)){ok=false;break}}if(!ok)continue;let p1=[A],k=(i+1)%poly.length;while(k!==(j+1)%poly.length){p1.push(poly[k]);k=(k+1)%poly.length}p1.push(B);let p2=[B];k=(j+1)%poly.length;while(k!==(i+1)%poly.length){p2.push(poly[k]);k=(k+1)%poly.length}p2.push(A);if(!good(p1,ideal)||!good(p2,ideal))continue;let sc=Math.abs(area(p1)-area(p2))/(area(p1)+area(p2));if(sc<bs){bs=sc;best=[p1,p2]}}return best}function cutShape(o,n){let total=area(o),ideal=total/n;for(let a=0;a<120;a++){let ps=[o.map(q=>[...q])];while(ps.length<n){let ids=ps.map((p,i)=>[area(p),i]).sort((a,b)=>b[0]-a[0]),done=false;for(const[,i]of ids){let s=split(ps[i],total,n);if(s){ps.splice(i,1,...s);done=true;break}}if(!done)break}if(ps.length===n&&ps.every(p=>good(p,ideal))&&Math.abs(ps.reduce((s,p)=>s+area(p),0)-total)<1)return ps}return null}
function photoParts(n){let x=145,y=125,w=430,h=265,ps=[];if(n===5){ps=[[[x,y],[x+215,y],[x+215,y+132],[x,y+132]],[[x+215,y],[x+w,y],[x+w,y+132],[x+215,y+132]],[[x,y+132],[x+143,y+132],[x+143,y+h],[x,y+h]],[[x+143,y+132],[x+287,y+132],[x+287,y+h],[x+143,y+h]],[[x+287,y+132],[x+w,y+132],[x+w,y+h],[x+287,y+h]]]}else{let cols=n===7?4:3,rows=n===7?2:3,cw=w/cols,rh=h/rows;for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){if(ps.length>=n)break;let xx=x+k*cw,yy=y+r*rh,ww=(ps.length===n-1&&n===7)?w-k*cw:cw;ps.push([[xx,yy],[xx+ww,yy],[xx+ww,yy+rh],[xx,yy+rh]])}}return ps}
function choose(){let keys=mode==='shape'?Object.keys(SHAPES):PHOTOS.map(x=>x.key),opts=keys.filter(k=>k!==last[mode]),key=opts[Math.floor(Math.random()*opts.length)];last[mode]=key;if(mode==='shape'){let s=SHAPES[key];return{key,type:'shape',name:s.name,emoji:s.emoji,outline:s.o,colors:s.cs}}let p=PHOTOS.find(x=>x.key===key);return{...p,type:'photo',outline:[[145,125],[575,125],[575,390],[145,390]]}}
function make(){let s=choose(),n=diff==='easy'?5:diff==='normal'?7:9,parts=s.type==='photo'?photoParts(n):cutShape(s.outline,n);if(!parts){toast('別の切り方を作成中…');setTimeout(make,20);return}current=s;pieces=parts.map((poly,i)=>{let cc=cen(poly);return{local:poly.map(q=>[q[0]-cc[0],q[1]-cc[1]]),target:cc,x:0,y:0,angle:0,col:(s.colors||[])[i%(s.colors||['#888']).length],placed:false,hint:false}});layout();restart();draw()}
function trans(p){let a=p.angle*Math.PI/180,cs=Math.cos(a),sn=Math.sin(a);return p.local.map(q=>[p.x+q[0]*cs-q[1]*sn,p.y+q[0]*sn+q[1]*cs])}function layout(){let n=pieces.length,cols=n<=5?3:n<=7?4:5,rows=Math.ceil(n/cols),cw=680/cols,rh=300/rows;pieces.forEach((p,i)=>{p.angle=Math.floor(Math.random()*8)*45;p.x=20+cw*(i%cols+.5);p.y=485+rh*(Math.floor(i/cols)+.5);let b=bounds(trans(p));if(b.minX<12)p.x+=12-b.minX;if(b.maxX>708)p.x-=b.maxX-708;if(b.minY<455)p.y+=455-b.minY;if(b.maxY>808)p.y-=b.maxY-808});initial=pieces.map(p=>({x:p.x,y:p.y,angle:p.angle}))}
function restart(){clearInterval(timer);start=Date.now();moves=0;document.getElementById('moves').textContent='0手';document.getElementById('time').textContent='0:00';document.getElementById('ov').style.display='none';timer=setInterval(()=>{let s=Math.floor((Date.now()-start)/1000);document.getElementById('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}
function scene(ctx,kind,x,y,w,h){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();let gr=ctx.createLinearGradient(0,y,0,y+h);if(kind==='aurora'){gr.addColorStop(0,'#08162f');gr.addColorStop(.5,'#245e69');gr.addColorStop(1,'#102b26')}else if(kind==='fuji'){gr.addColorStop(0,'#80b8d5');gr.addColorStop(.62,'#f0c7a2');gr.addColorStop(1,'#557d55')}else if(kind==='machu'){gr.addColorStop(0,'#82a7bb');gr.addColorStop(.48,'#b9c99a');gr.addColorStop(1,'#536d42')}else{gr.addColorStop(0,'#c95f43');gr.addColorStop(.5,'#efb05f');gr.addColorStop(1,'#8b5034')}ctx.fillStyle=gr;ctx.fillRect(x,y,w,h);if(kind==='fuji'){ctx.fillStyle='#4c6670';ctx.beginPath();ctx.moveTo(x+w*.12,y+h);ctx.lineTo(x+w*.52,y+h*.2);ctx.lineTo(x+w*.9,y+h);ctx.fill();ctx.fillStyle='#f4eee1';ctx.beginPath();ctx.moveTo(x+w*.39,y+h*.46);ctx.lineTo(x+w*.52,y+h*.2);ctx.lineTo(x+w*.65,y+h*.47);ctx.lineTo(x+w*.57,y+h*.42);ctx.lineTo(x+w*.51,y+h*.49);ctx.lineTo(x+w*.46,y+h*.41);ctx.fill()}else if(kind==='aurora'){for(let i=0;i<5;i++){ctx.strokeStyle=`rgba(${80+i*20},${220-i*5},${160+i*8},.55)`;ctx.lineWidth=28;ctx.beginPath();ctx.moveTo(x-30,y+h*(.18+i*.06));ctx.bezierCurveTo(x+w*.3,y+h*(.05+i*.09),x+w*.65,y+h*(.5-i*.05),x+w+30,y+h*(.2+i*.03));ctx.stroke()}}else{for(let i=0;i<5;i++){ctx.fillStyle=kind==='machu'?['#526a43','#668052','#7e9460'][i%3]:'#71422e';ctx.beginPath();ctx.moveTo(x-20,y+h);ctx.lineTo(x+w*(.12+i*.18),y+h*(.32+i*.08));ctx.lineTo(x+w*(.38+i*.15),y+h);ctx.fill()}if(kind==='machu'){ctx.fillStyle='#a99972';for(let i=0;i<7;i++)ctx.fillRect(x+w*(.12+i*.11),y+h*(.62+(i%2)*.05),w*.09,h*.05)}}ctx.restore()}
function drawSceneTarget(){let b=bounds(current.outline);scene(g,current.scene,b.minX,b.minY,b.maxX-b.minX,b.maxY-b.minY)}function draw(){g.clearRect(0,0,720,820);g.fillStyle='#6f4e2f';g.font='bold 22px -apple-system';g.textAlign='center';g.fillText(current.emoji+' '+current.name+(mode==='shape'?' のシルエット':''),360,40);g.textAlign='start';path(current.outline);if(mode==='photo'){g.save();g.globalAlpha=.18;g.clip();drawSceneTarget();g.restore()}else{g.fillStyle='#f8ead0';g.fill()}g.strokeStyle='#755333';g.lineWidth=7;g.stroke();pieces.forEach(p=>paint(p));pieces.filter(p=>p.hint).forEach(p=>{let q={...p,x:p.target[0],y:p.target[1],angle:0};g.save();g.globalAlpha=.35;path(trans(q));g.fillStyle='#fff4a5';g.fill();g.restore()})}
function paint(p){let poly=trans(p);g.save();path(poly);g.clip();if(mode==='photo'){let a=p.angle*Math.PI/180;g.translate(p.x,p.y);g.rotate(a);g.translate(-p.target[0],-p.target[1]);let b=bounds(current.outline);scene(g,current.scene,b.minX,b.minY,b.maxX-b.minX,b.maxY-b.minY)}else{g.fillStyle=p.col;g.fillRect(0,0,720,820)}g.restore();path(poly);g.strokeStyle='#654527';g.lineWidth=4;g.stroke()}
function pt(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*720/r.width,(e.clientY-r.top)*820/r.height]}function seg(px,py,a,b){let vx=b[0]-a[0],vy=b[1]-a[1],wx=px-a[0],wy=py-a[1],v=vx*vx+vy*vy,t=v?Math.max(0,Math.min(1,(wx*vx+wy*vy)/v)):0;return Math.hypot(px-a[0]-t*vx,py-a[1]-t*vy)}function hit(p,x,y){let q=trans(p);if(inside(q,x,y))return true;return q.some((a,i)=>seg(x,y,a,q[(i+1)%q.length])<32)}c.onpointerdown=e=>{e.preventDefault();let[x,y]=pt(e);for(let i=pieces.length-1;i>=0;i--){let p=pieces[i];if(hit(p,x,y)){p.placed=false;p.hint=false;pieces.splice(i,1);pieces.push(p);drag={p,dx:x-p.x,dy:y-p.y,sx:x,sy:y,m:false};c.setPointerCapture?.(e.pointerId);draw();break}}};c.onpointermove=e=>{if(!drag)return;e.preventDefault();let[x,y]=pt(e);if(Math.hypot(x-drag.sx,y-drag.sy)>10)drag.m=true;drag.p.x=x-drag.dx;drag.p.y=y-drag.dy;draw()};c.onpointerup=e=>{if(!drag)return;let p=drag.p;if(!drag.m)p.angle=(p.angle+45)%360;else snap(p);moves++;document.getElementById('moves').textContent=moves+'手';drag=null;draw();check()};function snap(p){let d=Math.hypot(p.x-p.target[0],p.y-p.target[1]),a=((p.angle%360)+360)%360,tol=diff==='easy'?28:diff==='normal'?22:18;if(d<tol&&(a<8||a>352)){p.x=p.target[0];p.y=p.target[1];p.angle=0;p.placed=true;navigator.vibrate?.(15)}}function check(){if(!pieces.every(p=>p.placed))return;clearInterval(timer);let s=Math.floor((Date.now()-start)/1000);document.getElementById('result').textContent=current.emoji+' '+current.name+'\n'+Math.floor(s/60)+'分'+s%60+'秒・'+moves+'手';document.getElementById('fact').textContent=current.fact||'';document.getElementById('ov').style.display='flex';chime()}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1500)}document.getElementById('hint').onclick=()=>{let p=pieces.find(x=>!x.placed);if(!p)return;p.hint=true;toast('💡 この辺り');draw()};document.getElementById('reset').onclick=()=>{pieces.forEach((p,i)=>Object.assign(p,initial[i],{placed:false,hint:false}));restart();draw()};document.getElementById('new').onclick=make;document.getElementById('again').onclick=make;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-d]').forEach(x=>x.classList.remove('on'));b.classList.add('on');diff=b.dataset.d;make()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;document.getElementById('sub').textContent=mode==='photo'?'世界の風景をバラして、元に戻す':'1枚を切って、元に戻す';make()});
function ensureAudio(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();audio.master=audio.createGain();audio.master.gain.value=.78;audio.master.connect(audio.destination)}
function note(f,t,d,v=.12,type='triangle',pan=0){let o=audio.createOscillator(),a=audio.createGain(),p=audio.createStereoPanner?audio.createStereoPanner():null,now=audio.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,now);a.gain.setValueAtTime(.001,now);a.gain.exponentialRampToValueAtTime(v,now+.025);a.gain.exponentialRampToValueAtTime(Math.max(.001,v*.55),now+Math.max(.04,d*.55));a.gain.exponentialRampToValueAtTime(.001,now+d);o.connect(a);if(p){p.pan.value=pan;a.connect(p);p.connect(audio.master)}else a.connect(audio.master);o.start(now);o.stop(now+d+.04)}
function kick(t,v=.2){let o=audio.createOscillator(),a=audio.createGain(),now=audio.currentTime+t;o.type='sine';o.frequency.setValueAtTime(105,now);o.frequency.exponentialRampToValueAtTime(43,now+.22);a.gain.setValueAtTime(v,now);a.gain.exponentialRampToValueAtTime(.001,now+.34);o.connect(a);a.connect(audio.master);o.start(now);o.stop(now+.36)}
function tom(t,f=120,v=.13){let o=audio.createOscillator(),a=audio.createGain(),now=audio.currentTime+t;o.type='triangle';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*.62,now+.18);a.gain.setValueAtTime(v,now);a.gain.exponentialRampToValueAtTime(.001,now+.27);o.connect(a);a.connect(audio.master);o.start(now);o.stop(now+.29)}
