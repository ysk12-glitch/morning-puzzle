function ensureAudio(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();audio.master=audio.createGain();audio.master.gain.value=.58;let comp=audio.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;audio.master.connect(comp);comp.connect(audio.destination)}function keep(n){audioNodes.push(n);n.onended=()=>{let i=audioNodes.indexOf(n);if(i>=0)audioNodes.splice(i,1)}}function stopMusic(){bgmTimer.forEach(clearTimeout);bgmTimer=[];audioNodes.splice(0).forEach(n=>{try{n.stop()}catch(e){}})}function voice(f,t,d,v=.1,type='triangle',attack=.08){let o=audio.createOscillator(),a=audio.createGain(),now=audio.currentTime+t;o.type=type;o.frequency.value=f;a.gain.setValueAtTime(.0001,now);a.gain.exponentialRampToValueAtTime(v,now+attack);a.gain.setValueAtTime(v*.8,now+Math.max(attack+.01,d*.62));a.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(a);a.connect(audio.master);keep(o);o.start(now);o.stop(now+d+.03)}function boom(t,v=.18){let o=audio.createOscillator(),a=audio.createGain(),now=audio.currentTime+t;o.type='sine';o.frequency.setValueAtTime(78,now);o.frequency.exponentialRampToValueAtTime(38,now+.42);a.gain.setValueAtTime(v,now);a.gain.exponentialRampToValueAtTime(.0001,now+.65);o.connect(a);a.connect(audio.master);keep(o);o.start(now);o.stop(now+.68)}function pulse(f,t,d=.18,v=.045){voice(f,t,d,v,'square',.012)}const BPM=82,B=60/BPM,BAR=B*4,LOOP=BAR*8;
function theme(){if(!bgmOn)return;let roots=[110,110,87.31,87.31,98,98,82.41,110];roots.forEach((r,i)=>{let t=i*BAR;voice(r,t,BAR*.94,.07,'sine',.3);voice(r*1.5,t+.05,BAR*.88,.025,'triangle',.45);boom(t,i===0||i===4?.22:.15);boom(t+B*2,.1);for(let k=0;k<4;k++)pulse(r*2,t+B*(k+.5),.12,k===3?.04:.025)});let motif=[[0,220,1.4],[1.5,261.63,.7],[2.5,293.66,1.3],[4,329.63,2.1],[8,220,1.2],[9.5,261.63,.7],[10.5,329.63,1.1],[12,293.66,2.2],[16,196,1.3],[17.5,220,.7],[18.5,261.63,1.2],[20,293.66,2],[24,246.94,1.2],[25.5,293.66,.7],[26.5,329.63,1.2],[28,440,1.1],[29.5,329.63,2.1]];motif.forEach((m,i)=>{voice(m[1],m[0]*B,m[2]*B,.085,i%3===0?'sawtooth':'triangle',.09);voice(m[1]/2,m[0]*B,m[2]*B,.025,'sine',.12)})}
function startMusic(){stopMusic();theme();let schedule=()=>{if(!bgmOn)return;theme();bgmTimer.push(setTimeout(schedule,LOOP*1000))};bgmTimer.push(setTimeout(schedule,LOOP*1000))}function toggleBgm(){ensureAudio();audio.resume();if(bgmOn){bgmOn=false;stopMusic();document.getElementById('sound').textContent='🔇 BGM';toast('BGM OFF')}else{bgmOn=true;document.getElementById('sound').textContent='🔊 BGM';startMusic();toast('BGM ON')}}function chime(){if(!bgmOn||!audio)return;voice(440,0,.35,.12);voice(523.25,.16,.45,.12);voice(659.25,.34,.7,.14)}document.getElementById('sound').onclick=toggleBgm;make();</script></body></html>
