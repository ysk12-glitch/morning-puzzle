<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f2dfbd"><title>朝の木工パズル</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{background:#f2dfbd;color:#3e2a19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}main{max-width:520px;height:100%;margin:auto;display:flex;flex-direction:column;min-height:0}.top{display:flex;align-items:center;justify-content:space-between;padding:4px 3px 5px}.top h1{font-size:20px;margin:0}.sub{font-size:10px;opacity:.6}.stats,.seg,.toolbar{display:flex;gap:5px}.pill{background:#fff8e8;border:1px solid #d4b98a;border-radius:12px;padding:5px 7px;font-weight:700;font-size:12px}.seg,.toolbar{margin:3px 0}.seg button,.toolbar button{flex:1}button{font:inherit;border:1px solid #b99562;background:#fff8e8;color:#3e2a19;border-radius:10px;padding:7px 2px;font-weight:700;font-size:12px;min-height:34px}.seg .on{background:#6f9b62;color:#fff}.board{flex:1;min-height:0;margin-top:3px;display:flex}canvas{display:block;width:100%;height:100%;min-height:0;background:#e9c98f;border:2px solid #9b7444;border-radius:15px;touch-action:none}.help{text-align:center;font-size:10px;opacity:.68;margin:4px 2px 2px}.overlay{position:fixed;inset:0;background:#2a1b10aa;display:none;align-items:center;justify-content:center;padding:25px;z-index:10}.card{background:#fff8e8;border-radius:22px;padding:24px;text-align:center;max-width:330px;width:100%}.big{font-size:20px;font-weight:800;margin:12px;white-space:pre-line}.card button{width:100%;background:#6f9b62;color:#fff}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#3e2a19;color:#fff8e8;padding:10px 14px;border-radius:14px;font-weight:800;opacity:0;pointer-events:none}.toast.show{opacity:1}</style></head><body><main><div class="top"><div><h1>🧩 朝の木工パズル</h1><div class="sub">シルエット木工パズル</div></div><div class="stats"><span class="pill" id="time">0:00</span><span class="pill" id="moves">0手</span></div></div><div class="seg"><button data-d="easy">やさしい</button><button data-d="normal" class="on">ふつう</button><button data-d="hard">むずかしい</button></div><div class="toolbar"><button id="new">🎲 新しい問題</button><button id="reset">↩︎ リセット</button><button id="hint">💡 ヒント</button></div><div class="board"><canvas id="c" width="720" height="820"></canvas></div><div class="help">指で移動・タップで45°回転。全ピースで枠をぴったり埋めよう。</div></main><div class="overlay" id="ov"><div class="card"><h2>完成！🎉</h2><div class="big" id="result"></div><button id="again">もう1問いく</button></div></div><div class="toast" id="toast"></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let diff='normal',pieces=[],drag=null,moves=0,start=0,timer,toastTimer,current,initial=[];
const SHAPES={fish:{name:'サカナ',emoji:'🐟',outline:[[125,240],[205,175],[345,155],[470,205],[565,145],[535,240],[565,335],[470,275],[345,325],[205,305]],center:[350,240],colors:['#2f7185','#438fa3','#64aebd','#89c7ce','#376b82','#6bb3c0','#9bd4d8','#4c8497','#7fc0c9','#5599aa']},house:{name:'おうち',emoji:'🏠',outline:[[145,255],[330,105],[515,255],[485,255],[485,410],[175,410],[175,255]],center:[330,275],colors:['#a34f3b','#c56748','#df8b5d','#edb17b','#9a6847','#c9875c','#e0a477']},fox:{name:'キツネ',emoji:'🦊',outline:[[180,130],[260,190],[330,165],[400,190],[480,130],[455,270],[405,365],[330,410],[255,365],[205,270]],center:[330,270],colors:['#a94f2e','#c46136','#db7841','#eb9658','#f0b477','#8e4932','#bc653e','#dc8753','#f2c28d','#c87346']}};
const pools={easy:['house','fish'],normal:['fish','house'],hard:['fox','fish']};
function path(poly){g.beginPath();g.moveTo(poly[0][0],poly[0][1]);for(let i=1;i<poly.length;i++)g.lineTo(poly[i][0],poly[i][1]);g.closePath()}function centroid(pts){let x=0,y=0;for(const p of pts){x+=p[0];y+=p[1]}return[x/pts.length,y/pts.length]}function pointIn(poly,x,y){let z=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let a=poly[i],b=poly[j];if(((a[1]>y)!=(b[1]>y))&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])z=!z}return z}
function makeCuts(s){return s.outline.map((p,i)=>[s.center,p,s.outline[(i+1)%s.outline.length]])}
function groups(n){let count=diff==='easy'?5:(diff==='normal'?7:n);count=Math.min(count,n);let out=[];for(let i=0;i<count;i++){let a=Math.floor(i*n/count),b=Math.floor((i+1)*n/count),ids=[];for(let k=a;k<b;k++)ids.push(k);out.push(ids)}return out}
function make(){let names=pools[diff],s=SHAPES[names[Math.floor(Math.random()*names.length)]];current={...s,cuts:makeCuts(s)};pieces=groups(current.cuts.length).map((ids,i)=>{let polys=ids.map(id=>current.cuts[id]),cc=centroid(polys.flat());return{ids,localPolys:polys.map(poly=>poly.map(q=>[q[0]-cc[0],q[1]-cc[1]])),target:cc,x:0,y:0,angle:0,col:current.colors[i%current.colors.length],placed:false}});shuffle();restart();draw()}
function transformPoly(p,poly){let a=p.angle*Math.PI/180,cs=Math.cos(a),sn=Math.sin(a);return poly.map(q=>[p.x+q[0]*cs-q[1]*sn,p.y+q[0]*sn+q[1]*cs])}function transformed(p){return p.localPolys.map(x=>transformPoly(p,x))}function edgeKey(a,b){let A=a.join(','),B=b.join(',');return A<B?A+'|'+B:B+'|'+A}function boundary(polys){let m=new Map;for(let poly of polys)for(let i=0;i<poly.length;i++){let a=poly[i],b=poly[(i+1)%poly.length],k=edgeKey(a,b);if(m.has(k))m.delete(k);else m.set(k,[a,b])}let es=[...m.values()],loop=[];if(!es.length)return loop;let e=es.pop();loop=[e[0],e[1]];let cur=e[1];while(es.length){let i=es.findIndex(x=>(x[0][0]===cur[0]&&x[0][1]===cur[1])||(x[1][0]===cur[0]&&x[1][1]===cur[1]));if(i<0)break;let n=es.splice(i,1)[0],nx=(n[0][0]===cur[0]&&n[0][1]===cur[1])?n[1]:n[0];if(nx[0]===loop[0][0]&&nx[1]===loop[0][1])break;loop.push(nx);cur=nx}return loop}
function shuffle(){let cols=diff==='easy'?3:diff==='normal'?4:5;pieces.forEach((p,i)=>{p.x=70+(i%cols)*(580/(cols-1||1));p.y=535+Math.floor(i/cols)*125;p.angle=Math.floor(Math.random()*8)*45;p.placed=false});initial=pieces.map(p=>({x:p.x,y:p.y,angle:p.angle}))}function restart(){clearInterval(timer);start=Date.now();moves=0;document.getElementById('moves').textContent='0手';document.getElementById('time').textContent='0:00';document.getElementById('ov').style.display='none';timer=setInterval(()=>{let s=Math.floor((Date.now()-start)/1000);document.getElementById('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}
function draw(){g.clearRect(0,0,720,820);g.fillStyle='#6f4e2f';g.font='bold 23px -apple-system';g.fillText(current.emoji+' '+current.name+' のシルエット',170,45);path(current.outline);g.fillStyle='#f8ead0';g.fill();g.strokeStyle='#755333';g.lineWidth=7;g.stroke();for(const p of pieces.filter(x=>x.placed))paint(p);for(const p of pieces.filter(x=>!x.placed))paint(p)}function paint(p){let ps=transformed(p);g.fillStyle=p.col;g.shadowColor='#4c301f55';g.shadowBlur=p.placed?2:10;g.shadowOffsetY=p.placed?1:5;for(const poly of ps){path(poly);g.fill()}g.shadowColor='transparent';let b=boundary(ps);if(b.length){path(b);g.strokeStyle='#654527';g.lineWidth=4;g.stroke()}}
function pt(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*720/r.width,(e.clientY-r.top)*820/r.height]}function segDist(px,py,a,b){let vx=b[0]-a[0],vy=b[1]-a[1],wx=px-a[0],wy=py-a[1],v=vx*vx+vy*vy,t=v?Math.max(0,Math.min(1,(wx*vx+wy*vy)/v)):0;return Math.hypot(px-(a[0]+t*vx),py-(a[1]+t*vy))}function hit(p,x,y){let ps=transformed(p);if(ps.some(q=>pointIn(q,x,y)))return true;for(let q of ps)for(let i=0;i<q.length;i++)if(segDist(x,y,q[i],q[(i+1)%q.length])<=34)return true;return Math.hypot(x-p.x,y-p.y)<=44}function pick(e){e.preventDefault();let[x,y]=pt(e);for(let i=pieces.length-1;i>=0;i--){let p=pieces[i];if(hit(p,x,y)){let was=p.placed;p.placed=false;pieces.splice(i,1);pieces.push(p);drag={p,dx:x-p.x,dy:y-p.y,sx:x,sy:y,moved:false,old:{x:p.x,y:p.y,angle:p.angle,placed:was}};c.setPointerCapture?.(e.pointerId);draw();break}}}c.addEventListener('pointerdown',pick);c.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();let[x,y]=pt(e);if(Math.hypot(x-drag.sx,y-drag.sy)>10)drag.moved=true;drag.p.x=x-drag.dx;drag.p.y=y-drag.dy;draw()});c.addEventListener('pointerup',e=>{if(!drag)return;e.preventDefault();let p=drag.p;if(!drag.moved)p.angle=(p.angle+45)%360;else snap(p);moves++;document.getElementById('moves').textContent=moves+'手';drag=null;draw();check()});c.addEventListener('pointercancel',()=>{if(drag){Object.assign(drag.p,drag.old);drag=null;draw()}});function angleError(a){a=((a%360)+360)%360;return Math.min(a,360-a)}function snap(p){let d=Math.hypot(p.x-p.target[0],p.y-p.target[1]),tol=diff==='easy'?45:diff==='normal'?34:26;if(d<tol&&angleError(p.angle)<=12){p.x=p.target[0];p.y=p.target[1];p.angle=0;p.placed=true;navigator.vibrate?.(20);return true}return false}function check(){if(!pieces.every(p=>p.placed))return;clearInterval(timer);let s=Math.floor((Date.now()-start)/1000);document.getElementById('result').textContent=current.emoji+' '+current.name+'\n'+Math.floor(s/60)+'分'+s%60+'秒・'+moves+'手';document.getElementById('ov').style.display='flex'}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1800)}document.getElementById('hint').onclick=()=>{let p=pieces.find(x=>!x.placed);if(!p)return;p.x=p.target[0];p.y=p.target[1];p.angle=0;p.placed=true;moves++;document.getElementById('moves').textContent=moves+'手';toast('💡 1ピース置いたよ');draw();check()};document.getElementById('reset').onclick=()=>{pieces.forEach((p,i)=>Object.assign(p,initial[i],{placed:false}));restart();draw()};document.getElementById('new').onclick=make;document.getElementById('again').onclick=make;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-d]').forEach(z=>z.classList.remove('on'));b.classList.add('on');diff=b.dataset.d;make()});make();</script></body></html>
