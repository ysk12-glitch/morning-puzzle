<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f2dfbd"><title>朝の木工パズル</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{background:#f2dfbd;color:#3e2a19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}main{max-width:520px;height:100%;margin:auto;display:flex;flex-direction:column;min-height:0}.top{display:flex;align-items:center;justify-content:space-between;padding:3px}.top h1{font-size:19px;margin:0}.sub{font-size:10px;opacity:.6}.stats,.seg,.toolbar{display:flex;gap:5px}.pill{background:#fff8e8;border:1px solid #d4b98a;border-radius:12px;padding:5px 7px;font-weight:700;font-size:12px}.seg,.toolbar{margin:3px 0}.seg button,.toolbar button{flex:1}button{font:inherit;border:1px solid #b99562;background:#fff8e8;color:#3e2a19;border-radius:10px;padding:6px 2px;font-weight:700;font-size:12px;min-height:33px}.seg .on{background:#6f9b62;color:#fff}.board{flex:1;min-height:0;margin-top:3px;display:flex}canvas{display:block;width:100%;height:100%;min-height:0;background:#e9c98f;border:2px solid #9b7444;border-radius:15px;touch-action:none}.help{text-align:center;font-size:10px;opacity:.68;margin:3px 2px}.overlay{position:fixed;inset:0;background:#2a1b10aa;display:none;align-items:center;justify-content:center;padding:25px;z-index:10}.card{background:#fff8e8;border-radius:22px;padding:24px;text-align:center;max-width:330px;width:100%}.big{font-size:20px;font-weight:800;margin:12px;white-space:pre-line}.card button{width:100%;background:#6f9b62;color:#fff}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#3e2a19;color:#fff8e8;padding:10px 14px;border-radius:14px;font-weight:800;opacity:0;pointer-events:none;z-index:20}.toast.show{opacity:1}</style></head><body><main><div class="top"><div><h1>🧩 朝の木工パズル</h1><div class="sub">1枚の完成形を切って、元に戻す</div></div><div class="stats"><span class="pill" id="time">0:00</span><span class="pill" id="moves">0手</span></div></div><div class="seg"><button data-d="easy">やさしい</button><button data-d="normal" class="on">ふつう</button><button data-d="hard">むずかしい</button></div><div class="toolbar"><button id="new">🎲 新しい問題</button><button id="reset">↩︎ リセット</button><button id="hint">💡 ヒント</button></div><div class="board"><canvas id="c" width="720" height="820"></canvas></div><div class="help">指で移動・タップで45°回転。掴みやすく、吸着は正解のすぐ近くだけ。</div></main><div class="overlay" id="ov"><div class="card"><h2>完成！🎉</h2><div class="big" id="result"></div><button id="again">もう1問いく</button></div></div><div class="toast" id="toast"></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let diff='normal',pieces=[],drag=null,moves=0,start=0,timer,toastTimer,current,initial=[],hintStage=0;
const SHAPES={fish:{name:'サカナ',emoji:'🐟',outline:[[125,240],[205,175],[345,155],[470,205],[565,145],[535,240],[565,335],[470,275],[345,325],[205,305]],colors:['#2f7185','#438fa3','#64aebd','#89c7ce','#376b82','#6bb3c0','#9bd4d8','#4c8497','#7fc0c9']},house:{name:'おうち',emoji:'🏠',outline:[[145,255],[330,105],[515,255],[485,255],[485,410],[175,410],[175,255]],colors:['#a34f3b','#c56748','#df8b5d','#edb17b','#9a6847','#c9875c','#e0a477','#b75b43','#e49a69']},fox:{name:'キツネ',emoji:'🦊',outline:[[180,130],[260,190],[330,165],[400,190],[480,130],[455,270],[405,365],[330,410],[255,365],[205,270]],colors:['#a94f2e','#c46136','#db7841','#eb9658','#f0b477','#8e4932','#bc653e','#dc8753','#f2c28d']},boat:{name:'ヨット',emoji:'⛵',outline:[[165,300],[310,300],[310,120],[455,300],[535,300],[485,370],[205,370]],colors:['#4f87a2','#6ba5bb','#91c4d1','#d4a05d','#b87843','#e3b878','#7297a5','#c88b4f','#9fc9d1']}};
const pools={easy:['house','fish','boat'],normal:['fish','house','fox','boat'],hard:['fox','fish','boat']};
function path(poly){g.beginPath();g.moveTo(poly[0][0],poly[0][1]);for(let i=1;i<poly.length;i++)g.lineTo(poly[i][0],poly[i][1]);g.closePath()}function signedArea(p){let a=0;for(let i=0;i<p.length;i++){let q=p[i],r=p[(i+1)%p.length];a+=q[0]*r[1]-r[0]*q[1]}return a/2}function area(p){return Math.abs(signedArea(p))}function centroid(p){let A=signedArea(p),cx=0,cy=0;if(Math.abs(A)<1)return p.reduce((s,q)=>[s[0]+q[0]/p.length,s[1]+q[1]/p.length],[0,0]);for(let i=0;i<p.length;i++){let q=p[i],r=p[(i+1)%p.length],k=q[0]*r[1]-r[0]*q[1];cx+=(q[0]+r[0])*k;cy+=(q[1]+r[1])*k}return[cx/(6*A),cy/(6*A)]}function pointIn(poly,x,y){let z=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let a=poly[i],b=poly[j];if(((a[1]>y)!=(b[1]>y))&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])z=!z}return z}function lerp(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}function bounds(poly){return{minX:Math.min(...poly.map(q=>q[0])),maxX:Math.max(...poly.map(q=>q[0])),minY:Math.min(...poly.map(q=>q[1])),maxY:Math.max(...poly.map(q=>q[1]))}}function dims(poly){let b=bounds(poly);return[b.maxX-b.minX,b.maxY-b.minY]}function quality(poly,total,count){let A=area(poly),[w,h]=dims(poly),mn=Math.min(w,h),mx=Math.max(w,h),ratio=mx/Math.max(1,mn),ideal=total/count;return A>ideal*.48&&A<ideal*1.8&&mn>42&&ratio<(diff==='hard'?4.0:3.3)}
function splitPoly(poly,total,count){let n=poly.length,best=null,bestScore=1e9;for(let tries=0;tries<180;tries++){let i=Math.floor(Math.random()*n),j=Math.floor(Math.random()*n);if(i===j||((i+1)%n)===j||((j+1)%n)===i)continue;let edge=.28+(diff==='hard'?Math.random()*.44:Math.random()*.34),edge2=.28+(diff==='hard'?Math.random()*.44:Math.random()*.34),A=lerp(poly[i],poly[(i+1)%n],edge),B=lerp(poly[j],poly[(j+1)%n],edge2);let inside=true;for(let s=1;s<16;s++){let q=lerp(A,B,s/16);if(!pointIn(poly,q[0],q[1])){inside=false;break}}if(!inside)continue;let p1=[A],k=(i+1)%n,guard=0;while(k!==(j+1)%n&&guard++<n+2){p1.push(poly[k]);k=(k+1)%n}p1.push(B);let p2=[B];k=(j+1)%n;guard=0;while(k!==(i+1)%n&&guard++<n+2){p2.push(poly[k]);k=(k+1)%n}p2.push(A);let a1=area(p1),a2=area(p2);if(Math.min(a1,a2)<total/count*.42)continue;let [w1,h1]=dims(p1),[w2,h2]=dims(p2);let r1=Math.max(w1,h1)/Math.max(1,Math.min(w1,h1)),r2=Math.max(w2,h2)/Math.max(1,Math.min(w2,h2));if(Math.min(w1,h1)<38||Math.min(w2,h2)<38||r1>4||r2>4)continue;let score=Math.abs(a1-a2)/(a1+a2)+(r1+r2)*.04;if(score<bestScore){best=[p1,p2];bestScore=score}}return best}
function cutSilhouette(outline,count){let total=area(outline);for(let attempt=0;attempt<80;attempt++){let parts=[outline.map(q=>[...q])],guard=0;while(parts.length<count&&guard++<250){let candidates=parts.map((p,i)=>({i,a:area(p)})).sort((a,b)=>b.a-a.a),done=false;for(const z of candidates){let s=splitPoly(parts[z.i],total,count);if(s){parts.splice(z.i,1,...s);done=true;break}}if(!done)break}if(parts.length===count&&parts.every(p=>quality(p,total,count))){let sum=parts.reduce((s,p)=>s+area(p),0);if(Math.abs(sum-total)<1)return parts}}return null}
function make(){let names=pools[diff],s=SHAPES[names[Math.floor(Math.random()*names.length)]],wanted=diff==='easy'?5:diff==='normal'?7:9,parts=cutSilhouette(s.outline,wanted);if(!parts){setTimeout(make,0);return}current=s;pieces=parts.map((poly,i)=>{let cc=centroid(poly);return{local:poly.map(q=>[q[0]-cc[0],q[1]-cc[1]]),target:cc,x:0,y:0,angle:0,col:s.colors[i%s.colors.length],placed:false,hint:false}});if(!layoutPieces()){setTimeout(make,0);return}restart();draw()}
function transformed(p){let a=p.angle*Math.PI/180,cs=Math.cos(a),sn=Math.sin(a);return p.local.map(q=>[p.x+q[0]*cs-q[1]*sn,p.y+q[0]*sn+q[1]*cs])}function overlapBounds(a,b,pad=8){return !(a.maxX+pad<b.minX||b.maxX+pad<a.minX||a.maxY+pad<b.minY||b.maxY+pad<a.minY)}function layoutPieces(){let placed=[];for(let i=0;i<pieces.length;i++){let p=pieces[i],ok=false;for(let t=0;t<180;t++){p.angle=Math.floor(Math.random()*8)*45;let bb0=bounds(p.local),w=bb0.maxX-bb0.minX,h=bb0.maxY-bb0.minY;p.x=45+Math.random()*630;p.y=500+Math.random()*280;let b=bounds(transformed(p));if(b.minX<12||b.maxX>708||b.minY<455||b.maxY>808)continue;if(placed.some(q=>overlapBounds(b,q,4)))continue;placed.push(b);ok=true;break}if(!ok)return false;p.placed=false}initial=pieces.map(p=>({x:p.x,y:p.y,angle:p.angle}));return true}
function restart(){clearInterval(timer);start=Date.now();moves=0;hintStage=0;document.getElementById('moves').textContent='0手';document.getElementById('time').textContent='0:00';document.getElementById('ov').style.display='none';timer=setInterval(()=>{let s=Math.floor((Date.now()-start)/1000);document.getElementById('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}
function draw(){g.clearRect(0,0,720,820);g.fillStyle='#6f4e2f';g.font='bold 23px -apple-system';g.fillText(current.emoji+' '+current.name+' のシルエット',170,42);path(current.outline);g.fillStyle='#f8ead0';g.fill();g.strokeStyle='#755333';g.lineWidth=7;g.stroke();for(const p of pieces.filter(x=>x.placed))paint(p);for(const p of pieces.filter(x=>!x.placed))paint(p);for(const p of pieces.filter(x=>x.hint)){g.save();g.globalAlpha=.28;g.fillStyle='#fff';let ghost={...p,x:p.target[0],y:p.target[1],angle:0};path(transformed(ghost));g.fill();g.lineWidth=8;g.strokeStyle='#fff6a8';g.stroke();g.restore()}}function paint(p){let poly=transformed(p);g.fillStyle=p.col;g.shadowColor='#4c301f55';g.shadowBlur=p.placed?2:8;g.shadowOffsetY=p.placed?1:4;path(poly);g.fill();g.shadowColor='transparent';g.strokeStyle='#654527';g.lineWidth=4;g.stroke()}
function pt(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*720/r.width,(e.clientY-r.top)*820/r.height]}function segDist(px,py,a,b){let vx=b[0]-a[0],vy=b[1]-a[1],wx=px-a[0],wy=py-a[1],v=vx*vx+vy*vy,t=v?Math.max(0,Math.min(1,(wx*vx+wy*vy)/v)):0;return Math.hypot(px-(a[0]+t*vx),py-(a[1]+t*vy))}function hit(p,x,y){let q=transformed(p);if(pointIn(q,x,y))return true;for(let i=0;i<q.length;i++)if(segDist(x,y,q[i],q[(i+1)%q.length])<=32)return true;return Math.hypot(x-p.x,y-p.y)<=42}function keepInside(p){let b=bounds(transformed(p));if(b.minX<8)p.x+=8-b.minX;if(b.maxX>712)p.x-=b.maxX-712;if(b.minY<55)p.y+=55-b.minY;if(b.maxY>812)p.y-=b.maxY-812}
function pick(e){e.preventDefault();let[x,y]=pt(e);for(let i=pieces.length-1;i>=0;i--){let p=pieces[i];if(hit(p,x,y)){let was=p.placed;p.placed=false;p.hint=false;pieces.splice(i,1);pieces.push(p);drag={p,dx:x-p.x,dy:y-p.y,sx:x,sy:y,moved:false,old:{x:p.x,y:p.y,angle:p.angle,placed:was}};c.setPointerCapture?.(e.pointerId);draw();break}}}c.addEventListener('pointerdown',pick);c.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();let[x,y]=pt(e);if(Math.hypot(x-drag.sx,y-drag.sy)>10)drag.moved=true;drag.p.x=x-drag.dx;drag.p.y=y-drag.dy;keepInside(drag.p);draw()});c.addEventListener('pointerup',e=>{if(!drag)return;e.preventDefault();let p=drag.p;if(!drag.moved){p.angle=(p.angle+45)%360;keepInside(p)}else snap(p);moves++;document.getElementById('moves').textContent=moves+'手';drag=null;draw();check()});c.addEventListener('pointercancel',()=>{if(drag){Object.assign(drag.p,drag.old);drag=null;draw()}});function angleError(a){a=((a%360)+360)%360;return Math.min(a,360-a)}function snap(p){let d=Math.hypot(p.x-p.target[0],p.y-p.target[1]),tol=diff==='easy'?28:diff==='normal'?22:18;if(d<tol&&angleError(p.angle)<=7){p.x=p.target[0];p.y=p.target[1];p.angle=0;p.placed=true;navigator.vibrate?.(18);return true}return false}function validCompletion(){if(!pieces.every(p=>p.placed))return false;let total=pieces.reduce((s,p)=>s+area(transformed(p)),0);return Math.abs(total-area(current.outline))<1&&pieces.every(p=>{let poly=transformed(p);return poly.every(q=>pointIn(current.outline,q[0]*.999+centroid(poly)[0]*.001,q[1]*.999+centroid(poly)[1]*.001)||segDist(q[0],q[1],current.outline[0],current.outline[1])<1)})}function check(){if(!pieces.every(p=>p.placed))return;if(!validCompletion()){toast('まだ枠がぴったり埋まってないよ');return}clearInterval(timer);let s=Math.floor((Date.now()-start)/1000);document.getElementById('result').textContent=current.emoji+' '+current.name+'\n'+Math.floor(s/60)+'分'+s%60+'秒・'+moves+'手';document.getElementById('ov').style.display='flex'}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1700)}
document.getElementById('hint').onclick=()=>{let p=pieces.find(x=>!x.placed);if(!p)return;pieces.forEach(x=>x.hint=false);hintStage=(hintStage%3)+1;if(hintStage===1){p.hint=true;toast('💡 この辺に入るよ');setTimeout(()=>{p.hint=false;draw()},1600)}else if(hintStage===2){p.hint=true;p.angle=0;toast('💡 向きだけ合わせたよ');setTimeout(()=>{p.hint=false;draw()},1600)}else{p.x=p.target[0];p.y=p.target[1];p.angle=0;p.placed=true;toast('💡 1ピース置いたよ');check()}moves++;document.getElementById('moves').textContent=moves+'手';draw()};document.getElementById('reset').onclick=()=>{pieces.forEach((p,i)=>Object.assign(p,initial[i],{placed:false,hint:false}));restart();draw()};document.getElementById('new').onclick=make;document.getElementById('again').onclick=make;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-d]').forEach(z=>z.classList.remove('on'));b.classList.add('on');diff=b.dataset.d;make()});make();</script></body></html>
