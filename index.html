<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f2dfbd"><title>朝の木工パズル</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{background:#f2dfbd;color:#3e2a19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}main{max-width:520px;height:100%;margin:auto;display:flex;flex-direction:column;min-height:0}.top{display:flex;align-items:center;justify-content:space-between;padding:4px 3px 5px;flex:0 0 auto}h1{font-size:20px;margin:0;line-height:1.05}.sub{font-size:10px;opacity:.6;margin-top:2px}.stats{display:flex;gap:4px}.pill{background:#fff8e8;border:1px solid #d4b98a;border-radius:12px;padding:5px 7px;font-weight:700;font-size:12px;white-space:nowrap}.seg,.toolbar{display:flex;gap:5px;margin:3px 0;flex:0 0 auto}.seg button,.toolbar button{flex:1}button{font:inherit;border:1px solid #b99562;background:#fff8e8;color:#3e2a19;border-radius:10px;padding:7px 2px;font-weight:700;font-size:12px;min-height:34px}button:active{transform:scale(.97)}.seg .on{background:#6f9b62;color:white;border-color:#6f9b62}.board{flex:1 1 auto;min-height:0;margin-top:3px;display:flex;align-items:stretch;justify-content:center}canvas{display:block;width:100%;height:100%;min-height:0;background:#e9c98f;border:2px solid #9b7444;border-radius:15px;box-shadow:inset 0 0 22px #9b744433,0 3px 12px #5b3b1e22;touch-action:none}.help{text-align:center;font-size:10px;opacity:.68;margin:4px 2px 2px;line-height:1.2;flex:0 0 auto}.overlay{position:fixed;inset:0;background:#2a1b10aa;display:none;align-items:center;justify-content:center;padding:25px;z-index:10}.card{background:#fff8e8;border-radius:22px;padding:24px;text-align:center;max-width:330px;width:100%}.big{font-size:20px;font-weight:800;margin:12px;white-space:pre-line}.card button{width:100%;background:#6f9b62;color:white;border:0}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);background:#3e2a19;color:#fff8e8;padding:10px 14px;border-radius:14px;font-weight:800;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body><main><div class="top"><div><h1>🧩 朝の木工パズル</h1><div class="sub">シルエット木工パズル</div></div><div class="stats"><span class="pill" id="time">0:00</span><span class="pill" id="moves">0手</span></div></div><div class="seg"><button data-d="easy">やさしい</button><button data-d="normal" class="on">ふつう</button><button data-d="hard">むずかしい</button></div><div class="toolbar"><button id="new">🎲 新しい問題</button><button id="reset">↩︎ リセット</button><button id="hint">💡 ヒント</button></div><div class="board"><canvas id="c" width="720" height="820"></canvas></div><div class="help">指で移動・タップで45°回転。向きと位置を合わせて隙間なく完成させよう。</div></main><div class="overlay" id="ov"><div class="card"><h2>完成！🎉</h2><div class="big" id="result"></div><button id="again">もう1問いく</button></div></div><div class="toast" id="toast"></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let diff='normal',pieces=[],drag=null,moves=0,start=0,timer,toastTimer,current,initial=[];
const P={
fish:{name:'サカナ',emoji:'🐟',outline:[[125,240],[205,175],[345,155],[470,205],[565,145],[535,240],[565,335],[470,275],[345,325],[205,305]],colors:['#2f7185','#438fa3','#64aebd','#89c7ce','#376b82','#6bb3c0','#9bd4d8','#4c8497','#7fc0c9'],cuts:[[[125,240],[205,175],[230,240]],[[125,240],[230,240],[205,305]],[[205,175],[345,155],[300,235],[230,240]],[[205,305],[230,240],[300,235],[345,325]],[[345,155],[470,205],[390,240],[300,235]],[[345,325],[300,235],[390,240],[470,275]],[[470,205],[565,145],[535,240],[390,240]],[[470,275],[390,240],[535,240],[565,335]],[[390,240],[535,240],[470,275],[470,205]]]},
cat:{name:'ネコ',emoji:'🐈',outline:[[175,335],[160,220],[205,135],[250,195],[330,170],[405,195],[450,135],[495,220],[480,335],[420,390],[250,390]],colors:['#6d4935','#8c5d3e','#ad744a','#cf9561','#e0b07d','#76513d','#b87d52','#d6a16e','#966344'],cuts:[[[160,220],[205,135],[250,195],[235,260]],[[205,135],[330,170],[250,195]],[[330,170],[450,135],[405,195]],[[450,135],[495,220],[405,195],[420,260]],[[160,220],[235,260],[250,390],[175,335]],[[235,260],[330,170],[330,290]],[[330,170],[405,195],[420,260],[330,290]],[[250,390],[235,260],[330,290],[330,390]],[[330,390],[330,290],[420,260],[480,335],[420,390]]]},
house:{name:'おうち',emoji:'🏠',outline:[[145,255],[330,105],[515,255],[485,255],[485,410],[175,410],[175,255]],colors:['#a34f3b','#c56748','#df8b5d','#edb17b','#9a6847','#c9875c','#e0a477','#b25b43','#f0c896'],cuts:[[[145,255],[330,105],[250,255]],[[330,105],[410,255],[250,255]],[[330,105],[515,255],[410,255]],[[175,255],[250,255],[250,410],[175,410]],[[250,255],[330,330],[250,410]],[[250,255],[410,255],[330,330]],[[410,255],[410,410],[330,330]],[[330,330],[410,410],[330,410]],[[410,255],[485,255],[485,410],[410,410]]]},
bird:{name:'トリ',emoji:'🐦',outline:[[120,260],[205,210],[285,120],[320,220],[440,175],[520,205],[455,245],[535,285],[430,300],[340,375],[300,290],[205,310]],colors:['#486b78','#668592','#83a0a8','#a2b7b9','#587987','#76949e','#91aaaf','#b0c1bf','#617f8a'],cuts:[[[120,260],[205,210],[220,265]],[[205,210],[285,120],[300,230],[220,265]],[[285,120],[320,220],[300,230]],[[320,220],[440,175],[370,250],[300,230]],[[440,175],[520,205],[455,245],[370,250]],[[455,245],[535,285],[430,300],[370,250]],[[430,300],[340,375],[335,285],[370,250]],[[340,375],[300,290],[335,285]],[[300,290],[205,310],[220,265],[300,230],[335,285]]]},
fox:{name:'キツネ',emoji:'🦊',outline:[[180,130],[260,190],[330,165],[400,190],[480,130],[455,270],[405,365],[330,410],[255,365],[205,270]],colors:['#a94f2e','#c46136','#db7841','#eb9658','#f0b477','#8e4932','#bc653e','#dc8753','#f2c28d'],cuts:[[[180,130],[260,190],[225,270],[205,270]],[[180,130],[205,270],[225,270]],[[260,190],[330,165],[330,270],[225,270]],[[330,165],[400,190],[435,270],[330,270]],[[400,190],[480,130],[455,270],[435,270]],[[225,270],[330,270],[285,350],[255,365]],[[330,270],[435,270],[375,350]],[[285,350],[330,270],[375,350],[330,410]],[[375,350],[435,270],[455,270],[405,365],[330,410]]]}}
const pools={easy:['house','fish'],normal:['cat','bird','fish'],hard:['fox','bird','cat']};
function path(poly){g.beginPath();g.moveTo(poly[0][0],poly[0][1]);for(let i=1;i<poly.length;i++)g.lineTo(poly[i][0],poly[i][1]);g.closePath()}function centroid(poly){let x=0,y=0;for(let p of poly){x+=p[0];y+=p[1]}return[x/poly.length,y/poly.length]}function pointIn(poly,x,y){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let a=poly[i],b=poly[j];if(((a[1]>y)!=(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))inside=!inside}return inside}
function groupsForDifficulty(){if(diff==='hard')return [[0],[1],[2],[3],[4],[5],[6],[7],[8]];if(diff==='normal')return [[0,1],[2],[3],[4],[5],[6,8],[7]];return [[0,1],[2,4],[3,5],[6,8],[7]]}
function make(){let names=pools[diff],name=names[Math.floor(Math.random()*names.length)];current=P[name];let groups=groupsForDifficulty();pieces=groups.map((ids,i)=>{let polys=ids.map(id=>current.cuts[id]);let pts=polys.flat(),cc=centroid(pts),localPolys=polys.map(poly=>poly.map(q=>[q[0]-cc[0],q[1]-cc[1]]));return{ids,localPolys,target:[cc[0],cc[1]],x:0,y:0,angle:0,col:current.colors[i%current.colors.length],placed:false}});shuffle();restart();draw()}
function transformPoly(p,poly){let a=p.angle*Math.PI/180,cs=Math.cos(a),sn=Math.sin(a);return poly.map(q=>[p.x+q[0]*cs-q[1]*sn,p.y+q[0]*sn+q[1]*cs])}function transformed(p){return p.localPolys.map(poly=>transformPoly(p,poly))}
function shuffle(){let cols=diff==='easy'?3:diff==='normal'?4:5;pieces.forEach((p,i)=>{p.x=75+(i%cols)*(570/(cols-1||1))+Math.random()*10;p.y=535+Math.floor(i/cols)*120+Math.random()*10;p.angle=Math.floor(Math.random()*8)*45;p.placed=false});initial=pieces.map(p=>({x:p.x,y:p.y,angle:p.angle}))}
function restart(){clearInterval(timer);start=Date.now();moves=0;document.getElementById('moves').textContent='0手';document.getElementById('time').textContent='0:00';document.getElementById('ov').style.display='none';timer=setInterval(()=>{let s=Math.floor((Date.now()-start)/1000);document.getElementById('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}
function draw(){g.clearRect(0,0,720,820);g.fillStyle='#6f4e2f';g.font='bold 23px -apple-system';g.fillText(current.emoji+' '+current.name+' のシルエット',170,45);path(current.outline);g.fillStyle='#f8ead0';g.fill();g.strokeStyle='#755333';g.lineWidth=7;g.stroke();for(let p of pieces.filter(p=>p.placed))paint(p);for(let p of pieces.filter(p=>!p.placed))paint(p)}
function paint(p){let polys=transformed(p);g.fillStyle=p.col;g.shadowColor='#4c301f55';g.shadowBlur=p.placed?2:10;g.shadowOffsetY=p.placed?1:5;for(let poly of polys){path(poly);g.fill()}g.shadowColor='transparent';g.strokeStyle='#654527';g.lineWidth=4;for(let poly of polys){path(poly);g.stroke()}}
function pt(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*720/r.width,(e.clientY-r.top)*820/r.height]}
function segDist(px,py,a,b){let vx=b[0]-a[0],vy=b[1]-a[1],wx=px-a[0],wy=py-a[1],vv=vx*vx+vy*vy,t=vv?Math.max(0,Math.min(1,(wx*vx+wy*vy)/vv)):0,dx=px-(a[0]+t*vx),dy=py-(a[1]+t*vy);return Math.hypot(dx,dy)}
function hit(p,a,b){let polys=transformed(p);if(polys.some(poly=>pointIn(poly,a,b)))return true;let grab=34;for(let poly of polys)for(let i=0;i<poly.length;i++)if(segDist(a,b,poly[i],poly[(i+1)%poly.length])<=grab)return true;return Math.hypot(a-p.x,b-p.y)<=42}
function pick(e){e.preventDefault();let[a,b]=pt(e);for(let i=pieces.length-1;i>=0;i--){let p=pieces[i];if(hit(p,a,b)){let was=p.placed;p.placed=false;pieces.splice(i,1);pieces.push(p);drag={p,dx:a-p.x,dy:b-p.y,sx:a,sy:b,moved:false,old:{x:p.x,y:p.y,angle:p.angle,placed:was}};c.setPointerCapture?.(e.pointerId);draw();break}}}
c.addEventListener('pointerdown',pick);c.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();let[a,b]=pt(e);if(Math.hypot(a-drag.sx,b-drag.sy)>10)drag.moved=true;drag.p.x=a-drag.dx;drag.p.y=b-drag.dy;draw()});c.addEventListener('pointerup',e=>{if(!drag)return;e.preventDefault();let p=drag.p;if(!drag.moved){p.angle=(p.angle+45)%360;moves++}else{snap(p);moves++}document.getElementById('moves').textContent=moves+'手';drag=null;draw();check()});c.addEventListener('pointercancel',()=>{if(drag){Object.assign(drag.p,drag.old);drag=null;draw()}});
function angleError(a){a=((a%360)+360)%360;return Math.min(a,360-a)}
function snap(p){let d=Math.hypot(p.x-p.target[0],p.y-p.target[1]),ae=angleError(p.angle);let tol=diff==='easy'?48:diff==='normal'?36:28;let atol=12;if(d<tol&&ae<=atol){p.x=p.target[0];p.y=p.target[1];p.angle=0;p.placed=true;navigator.vibrate?.(20);return true}return false}
function sampleCovered(x,y){for(let p of pieces){for(let poly of transformed(p))if(pointIn(poly,x,y))return true}return false}
function actuallyFilled(){let minX=Math.min(...current.outline.map(q=>q[0])),maxX=Math.max(...current.outline.map(q=>q[0])),minY=Math.min(...current.outline.map(q=>q[1])),maxY=Math.max(...current.outline.map(q=>q[1]));let inside=0,covered=0;for(let y=minY+4;y<maxY;y+=8)for(let x=minX+4;x<maxX;x+=8)if(pointIn(current.outline,x,y)){inside++;if(sampleCovered(x,y))covered++}return inside>0&&covered/inside>.985}
function check(){if(!pieces.every(p=>p.placed)||!actuallyFilled())return;clearInterval(timer);let s=Math.floor((Date.now()-start)/1000);document.getElementById('result').textContent=current.emoji+' '+current.name+'\n'+Math.floor(s/60)+'分'+s%60+'秒・'+moves+'手';document.getElementById('ov').style.display='flex'}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2400)}
document.getElementById('hint').onclick=()=>{let p=pieces.find(p=>!p.placed);if(!p)return;p.x=p.target[0];p.y=p.target[1];p.angle=0;p.placed=true;moves++;document.getElementById('moves').textContent=moves+'手';navigator.vibrate?.(20);toast('💡 1ピースだけ正しい場所に置いたよ');draw();check()};document.getElementById('reset').onclick=()=>{pieces.forEach((p,i)=>Object.assign(p,initial[i],{placed:false}));restart();draw()};document.getElementById('new').onclick=make;document.getElementById('again').onclick=make;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-d]').forEach(z=>z.classList.remove('on'));b.classList.add('on');diff=b.dataset.d;make()});make();
</script></body></html>
