<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ead4a8"><title>朝の木工パズル</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#ead4a8;color:#3e2a19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}main{max-width:520px;height:100%;margin:auto;display:flex;flex-direction:column;min-height:0}.top{display:flex;align-items:center;justify-content:space-between;padding:2px 3px}.top h1{font-size:18px;margin:0}.sub{font-size:9px;opacity:.68}.stats,.row{display:flex;gap:4px}.pill{background:#fff8e8;border:1px solid #caa978;border-radius:11px;padding:4px 6px;font-weight:700;font-size:11px}.row{margin:2px 0}.row button{flex:1}button{font:inherit;border:1px solid #b58b55;background:#fff8e8;color:#3e2a19;border-radius:9px;padding:5px 2px;font-weight:700;font-size:11px;min-height:30px}.on{background:#719766!important;color:#fff!important}.board{flex:1;min-height:0;margin-top:2px;display:flex}canvas{display:block;width:100%;height:100%;background:#e6c483;border:2px solid #906b3f;border-radius:14px;touch-action:none}.help{text-align:center;font-size:9px;opacity:.7;margin:2px}.overlay{position:fixed;inset:0;background:#20150dcc;display:none;align-items:center;justify-content:center;padding:25px;z-index:10}.card{background:#fff8e8;border-radius:20px;padding:22px;text-align:center;max-width:340px;width:100%}.big{font-size:18px;font-weight:800;margin:10px;white-space:pre-line}.fact{font-size:12px;line-height:1.5;margin:8px}.credit{font-size:9px;opacity:.65}.card button{width:100%;background:#719766;color:#fff}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#3e2a19;color:#fff8e8;padding:9px 13px;border-radius:13px;font-weight:800;opacity:0;pointer-events:none;z-index:20}.toast.show{opacity:1}</style></head><body><main><div class="top"><div><h1>🧩 朝の木工パズル</h1><div class="sub" id="sub">1枚を切って、元に戻す</div></div><div class="stats"><span class="pill" id="time">0:00</span><span class="pill" id="moves">0手</span></div></div><div class="row"><button data-mode="shape" class="on">🪵 シルエット</button><button data-mode="photo">🌍 世界の風景</button><button id="sound">🔇 BGM</button></div><div class="row"><button data-d="easy">やさしい</button><button data-d="normal" class="on">ふつう</button><button data-d="hard">むずかしい</button></div><div class="row"><button id="new">🎲 新しい問題</button><button id="reset">↩︎ リセット</button><button id="hint">💡 ヒント</button></div><div class="board"><canvas id="c" width="720" height="820"></canvas></div><div class="help">指で移動・タップで45°回転。近く＋正しい向きの時だけはまります。</div></main><div class="overlay" id="ov"><div class="card"><h2>完成！🎉</h2><div class="big" id="result"></div><div class="fact" id="fact"></div><div class="credit" id="credit"></div><button id="again">もう1問いく</button></div></div><div class="toast" id="toast"></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let diff='normal',mode='shape',pieces=[],drag=null,moves=0,start=0,timer,current,initial=[],last={shape:'',photo:''},audio=null,bgmOn=false,musicNodes=[],musicTimer=null;
const SHAPES={fish:{name:'サカナ',emoji:'🐟',o:[[150,245],[225,190],[350,175],[455,210],[535,165],[510,245],[535,325],[455,280],[350,315],[225,300]],cs:['#2f7185','#438fa3','#64aebd','#89c7ce','#376b82','#6bb3c0','#9bd4d8','#4b91a0','#7ec0c8']},house:{name:'おうち',emoji:'🏠',o:[[180,260],[330,135],[480,260],[460,260],[460,390],[200,390],[200,260]],cs:['#a34f3b','#c56748','#df8b5d','#edb17b','#9a6847','#c9875c','#e0a477','#b65c42','#d69268']},fox:{name:'キツネ',emoji:'🦊',o:[[205,155],[265,205],[330,185],[395,205],[455,155],[438,270],[395,345],[330,385],[265,345],[222,270]],cs:['#a94f2e','#c46136','#db7841','#eb9658','#f0b477','#8e4932','#bc653e','#d77d4b','#e5a16c']},boat:{name:'ヨット',emoji:'⛵',o:[[190,300],[310,300],[310,145],[440,300],[510,300],[465,360],[225,360]],cs:['#4f87a2','#6ba5bb','#91c4d1','#d4a05d','#b87843','#e3b878','#7297a5','#86b4c1','#c68b50']}};
const PHOTOS=[{key:'machu',name:'マチュ・ピチュ',emoji:'🇵🇪',fact:'ペルー・アンデス山中のインカ帝国の遺跡。',credit:'Photo: Alec Gamoff / CC BY 2.0',url:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Panoramic_view_of_Machu_Picchu.jpg/960px-Panoramic_view_of_Machu_Picchu.jpg'},{key:'fuji',name:'富士山・河口湖',emoji:'🇯🇵',fact:'河口湖から望む富士山。',credit:'Photo: Subramaniam K V / CC BY 3.0',url:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Mount_Fuji_from_Lake_Kawaguchi.jpg/960px-Mount_Fuji_from_Lake_Kawaguchi.jpg'},{key:'mont',name:'モン・サン＝ミシェル',emoji:'🇫🇷',fact:'フランス・ノルマンディーの湾に浮かぶ修道院。',credit:'Photo: Giles Laurent / Wikimedia Commons',url:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/1001_Mont-Saint-Michel_reflecting_in_the_water_Photo_by_Giles_Laurent.jpg/960px-1001_Mont-Saint-Michel_reflecting_in_the_water_Photo_by_Giles_Laurent.jpg'}];
function path(p){g.beginPath();g.moveTo(...p[0]);for(let i=1;i<p.length;i++)g.lineTo(...p[i]);g.closePath()}function sa(p){let a=0;for(let i=0;i<p.length;i++){let q=p[i],r=p[(i+1)%p.length];a+=q[0]*r[1]-r[0]*q[1]}return a/2}function area(p){return Math.abs(sa(p))}function cen(p){let A=sa(p),x=0,y=0;if(Math.abs(A)<1)return p.reduce((s,q)=>[s[0]+q[0]/p.length,s[1]+q[1]/p.length],[0,0]);for(let i=0;i<p.length;i++){let q=p[i],r=p[(i+1)%p.length],k=q[0]*r[1]-r[0]*q[1];x+=(q[0]+r[0])*k;y+=(q[1]+r[1])*k}return[x/(6*A),y/(6*A)]}function inside(p,x,y){let z=false;for(let i=0,j=p.length-1;i<p.length;j=i++){let a=p[i],b=p[j];if(((a[1]>y)!=(b[1]>y))&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])z=!z}return z}function bounds(p){return{minX:Math.min(...p.map(q=>q[0])),maxX:Math.max(...p.map(q=>q[0])),minY:Math.min(...p.map(q=>q[1])),maxY:Math.max(...p.map(q=>q[1]))}}function dims(p){let b=bounds(p);return[b.maxX-b.minX,b.maxY-b.minY]}function compact(p){let[w,h]=dims(p);return area(p)/(w*h||1)}function minEdge(p){let m=1e9;for(let i=0;i<p.length;i++)m=Math.min(m,Math.hypot(p[i][0]-p[(i+1)%p.length][0],p[i][1]-p[(i+1)%p.length][1]));return m}function clip(poly,vert,k,low){let out=[];for(let i=0;i<poly.length;i++){let a=poly[i],b=poly[(i+1)%poly.length],va=(vert?a[0]:a[1])-k,vb=(vert?b[0]:b[1])-k,ia=low?va<=0:va>=0,ib=low?vb<=0:vb>=0;if(ia)out.push(a);if(ia!==ib){let t=va/(va-vb);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}return out}function quality(p){let[w,h]=dims(p),mn=Math.min(w,h),mx=Math.max(w,h);return p.length>=3&&area(p)>3100&&mn>58&&mx/mn<1.95&&compact(p)>.34&&minEdge(p)>18}
function balancedCut(o,n){for(let attempt=0;attempt<500;attempt++){let ps=[o.map(q=>[...q])],guard=0;while(ps.length<n&&guard++<40){let order=ps.map((p,i)=>({p,i,A:area(p)})).sort((a,b)=>b.A-a.A),done=false;for(const z of order){let b=bounds(z.p),w=b.maxX-b.minX,h=b.maxY-b.minY,dirs=w>h*1.15?[true,false]:h>w*1.15?[false,true]:Math.random()<.5?[true,false]:[false,true];for(const vert of dirs){for(const frac of [.5,.46,.54,.43,.57,.4,.6]){let k=(vert?b.minX:b.minY)+(vert?w:h)*frac,A=clip(z.p,vert,k,true),B=clip(z.p,vert,k,false);if(quality(A)&&quality(B)){ps.splice(z.i,1,A,B);done=true;break}}if(done)break}if(done)break}if(!done)break}if(ps.length===n&&ps.every(quality))return ps}return null}
function photoParts(n){let x=145,y=125,w=430,h=265;if(n===5){let xm=x+w*.48,ym=y+h*.52;return[[[x,y],[xm,y],[xm,ym],[x,ym]],[[xm,y],[x+w,y],[x+w,ym],[xm,ym]],[[x,ym],[x+w*.32,ym],[x+w*.32,y+h],[x,y+h]],[[x+w*.32,ym],[x+w*.68,ym],[x+w*.68,y+h],[x+w*.32,y+h]],[[x+w*.68,ym],[x+w,ym],[x+w,y+h],[x+w*.68,y+h]]]}if(n===7){let y1=y+h*.48,a=x+w*.32,b=x+w*.66,c=x+w*.25,d=x+w*.5,e=x+w*.75;return[[[x,y],[a,y],[a,y1],[x,y1]],[[a,y],[b,y],[b,y1],[a,y1]],[[b,y],[x+w,y],[x+w,y1],[b,y1]],[[x,y1],[c,y1],[c,y+h],[x,y+h]],[[c,y1],[d,y1],[d,y+h],[c,y+h]],[[d,y1],[e,y1],[e,y+h],[d,y+h]],[[e,y1],[x+w,y1],[x+w,y+h],[e,y+h]]]}let a=x+w/3,b=x+2*w/3,y1=y+h/3,y2=y+2*h/3;return[[[x,y],[a,y],[a,y1],[x,y1]],[[a,y],[b,y],[b,y1],[a,y1]],[[b,y],[x+w,y],[x+w,y1],[b,y1]],[[x,y1],[a,y1],[a,y2],[x,y2]],[[a,y1],[b,y1],[b,y2],[a,y2]],[[b,y1],[x+w,y1],[x+w,y2],[b,y2]],[[x,y2],[a,y2],[a,y+h],[x,y+h]],[[a,y2],[b,y2],[b,y+h],[a,y+h]],[[b,y2],[x+w,y2],[x+w,y+h],[b,y+h]]]}
function choose(){if(mode==='shape'){let keys=Object.keys(SHAPES),opts=keys.filter(k=>k!==last.shape),key=opts[Math.floor(Math.random()*opts.length)];last.shape=key;let s=SHAPES[key];return{key,type:'shape',name:s.name,emoji:s.emoji,outline:s.o,colors:s.cs}}let opts=PHOTOS.filter(p=>p.key!==last.photo),s=opts[Math.floor(Math.random()*opts.length)];last.photo=s.key;return{...s,type:'photo',outline:[[145,125],[575,125],[575,390],[145,390]],img:null}}
function make(){let n=diff==='easy'?5:diff==='normal'?7:9,s=choose();if(s.type==='shape'){let parts=balancedCut(s.outline,n),tries=0;while(!parts&&tries++<6){s=choose();parts=balancedCut(s.outline,n)}if(!parts){toast('別の問題を作ります');setTimeout(make,40);return}current=s;build(s,parts)}else{current=s;loadPhoto(s,n)}}function loadPhoto(s,n){g.clearRect(0,0,720,820);g.fillStyle='#6f4e2f';g.font='bold 22px -apple-system';g.textAlign='center';g.fillText('📷 風景写真を読み込み中…',360,250);let im=new Image,done=false,to=setTimeout(()=>{if(!done&&current===s)photoFail()},7000);function photoFail(){done=true;clearTimeout(to);toast('写真を読み込めませんでした');document.querySelector('[data-mode="shape"]').click()}im.onload=()=>{done=true;clearTimeout(to);if(current!==s)return;s.img=im;build(s,photoParts(n))};im.onerror=photoFail;im.src=s.url}
function build(s,parts){pieces=parts.map((poly,i)=>{let cc=cen(poly);return{local:poly.map(q=>[q[0]-cc[0],q[1]-cc[1]]),target:cc,x:0,y:0,angle:0,col:(s.colors||[])[i%(s.colors||['#888']).length],placed:false,hint:false}});layout();restart();draw()}function trans(p){let a=p.angle*Math.PI/180,cs=Math.cos(a),sn=Math.sin(a);return p.local.map(q=>[p.x+q[0]*cs-q[1]*sn,p.y+q[0]*sn+q[1]*cs])}function overlap(a,b,pad=9){return!(a.maxX+pad<b.minX||b.maxX+pad<a.minX||a.maxY+pad<b.minY||b.maxY+pad<a.minY)}function layout(){let used=[];for(let i=0;i<pieces.length;i++){let p=pieces[i],ok=false;for(let t=0;t<1800;t++){p.angle=Math.floor(Math.random()*8)*45;p.x=60+Math.random()*600;p.y=500+Math.random()*265;let b=bounds(trans(p));if(b.minX<14||b.maxX>706||b.minY<450||b.maxY>806||used.some(u=>overlap(b,u)))continue;used.push(b);ok=true;break}if(!ok){p.angle=(i%4)*90;let cols=pieces.length<=5?3:4,row=Math.floor(i/cols),col=i%cols;p.x=85+col*(550/(cols-1||1));p.y=515+row*135}}initial=pieces.map(p=>({x:p.x,y:p.y,angle:p.angle}))}
function restart(){clearInterval(timer);start=Date.now();moves=0;document.getElementById('moves').textContent='0手';document.getElementById('time').textContent='0:00';document.getElementById('ov').style.display='none';timer=setInterval(()=>{let s=Math.floor((Date.now()-start)/1000);document.getElementById('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}function imageAt(ctx){let b=bounds(current.outline),iw=current.img.naturalWidth,ih=current.img.naturalHeight,tw=b.maxX-b.minX,th=b.maxY-b.minY,sc=Math.max(tw/iw,th/ih),sw=tw/sc,sh=th/sc,sx=(iw-sw)/2,sy=(ih-sh)/2;ctx.drawImage(current.img,sx,sy,sw,sh,b.minX,b.minY,tw,th)}function draw(){g.clearRect(0,0,720,820);g.fillStyle='#6f4e2f';g.font='bold 22px -apple-system';g.textAlign='center';g.fillText(current.emoji+' '+current.name+(mode==='shape'?' のシルエット':''),360,40);g.textAlign='start';path(current.outline);if(mode==='photo'){g.save();g.globalAlpha=.13;g.clip();imageAt(g);g.restore()}else{g.fillStyle='#f8ead0';g.fill()}g.strokeStyle='#755333';g.lineWidth=7;g.stroke();pieces.forEach(p=>paint(p));pieces.filter(p=>p.hint).forEach(p=>{let q={...p,x:p.target[0],y:p.target[1],angle:0};g.save();g.globalAlpha=.32;path(trans(q));g.fillStyle='#fff4a5';g.fill();g.restore()})}function paint(p){let poly=trans(p);g.save();path(poly);g.clip();if(mode==='photo'){let a=p.angle*Math.PI/180;g.translate(p.x,p.y);g.rotate(a);g.translate(-p.target[0],-p.target[1]);imageAt(g)}else{g.fillStyle=p.col;g.fillRect(0,0,720,820)}g.restore();path(poly);g.strokeStyle='#654527';g.lineWidth=4;g.stroke()}
function pt(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*720/r.width,(e.clientY-r.top)*820/r.height]}function seg(px,py,a,b){let vx=b[0]-a[0],vy=b[1]-a[1],wx=px-a[0],wy=py-a[1],v=vx*vx+vy*vy,t=v?Math.max(0,Math.min(1,(wx*vx+wy*vy)/v)):0;return Math.hypot(px-a[0]-t*vx,py-a[1]-t*vy)}function hit(p,x,y){let q=trans(p);return inside(q,x,y)||q.some((a,i)=>seg(x,y,a,q[(i+1)%q.length])<34)}c.onpointerdown=e=>{e.preventDefault();let[x,y]=pt(e);for(let i=pieces.length-1;i>=0;i--){let p=pieces[i];if(hit(p,x,y)){p.placed=false;p.hint=false;pieces.splice(i,1);pieces.push(p);drag={p,dx:x-p.x,dy:y-p.y,sx:x,sy:y,m:false};draw();break}}};c.onpointermove=e=>{if(!drag)return;e.preventDefault();let[x,y]=pt(e);if(Math.hypot(x-drag.sx,y-drag.sy)>10)drag.m=true;drag.p.x=x-drag.dx;drag.p.y=y-drag.dy;draw()};c.onpointerup=e=>{if(!drag)return;let p=drag.p;if(!drag.m)p.angle=(p.angle+45)%360;else snap(p);moves++;document.getElementById('moves').textContent=moves+'手';drag=null;draw();check()};function snap(p){let d=Math.hypot(p.x-p.target[0],p.y-p.target[1]),a=((p.angle%360)+360)%360,tol=diff==='easy'?27:diff==='normal'?21:17;if(d<tol&&(a<5||a>355)){p.x=p.target[0];p.y=p.target[1];p.angle=0;p.placed=true;navigator.vibrate?.(15)}}function check(){if(!pieces.every(p=>p.placed))return;clearInterval(timer);let s=Math.floor((Date.now()-start)/1000);document.getElementById('result').textContent=current.emoji+' '+current.name+'\n'+Math.floor(s/60)+'分'+s%60+'秒・'+moves+'手';document.getElementById('fact').textContent=current.fact||'';document.getElementById('credit').textContent=current.credit||'';document.getElementById('ov').style.display='flex'}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1600)}document.getElementById('hint').onclick=()=>{let p=pieces.find(x=>!x.placed);if(p){p.hint=true;toast('💡 置き場所を薄く表示');draw()}};document.getElementById('reset').onclick=()=>{pieces.forEach((p,i)=>Object.assign(p,initial[i],{placed:false,hint:false}));restart();draw()};document.getElementById('new').onclick=make;document.getElementById('again').onclick=make;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-d]').forEach(x=>x.classList.remove('on'));b.classList.add('on');diff=b.dataset.d;make()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;document.getElementById('sub').textContent=mode==='photo'?'風景写真をバラして、元に戻す':'1枚を切って、元に戻す';make()});
const bgm=new Audio('Clear_Pallet.mp3');bgm.loop=true;bgm.preload='auto';bgm.volume=.55;async function toggleBgm(){bgmOn=!bgmOn;if(bgmOn){try{await bgm.play();document.getElementById('sound').textContent='🔊 BGM';toast('Clear Pallet ♪')}catch(e){bgmOn=false;document.getElementById('sound').textContent='🔇 BGM';toast('もう一度BGMを押してね')}}else{bgm.pause();document.getElementById('sound').textContent='🔇 BGM';toast('BGM OFF')}}document.getElementById('sound').onclick=toggleBgm;make();
</script></body></html>
