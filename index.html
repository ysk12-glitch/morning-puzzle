<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f2dfbd"><title>朝の木工パズル</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f2dfbd;color:#3e2a19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}main{max-width:520px;margin:auto}.top{display:flex;align-items:end;justify-content:space-between;padding:12px 4px 8px}h1{font-size:24px;margin:0}.sub{font-size:12px;opacity:.65}.stats{display:flex;gap:8px}.pill{background:#fff8e8;border:1px solid #d4b98a;border-radius:14px;padding:6px 10px;font-weight:700;font-size:13px}.toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:6px 0 9px}button{font:inherit;border:1px solid #b99562;background:#fff8e8;color:#3e2a19;border-radius:12px;padding:10px 6px;font-weight:700}button:active{transform:scale(.97)}canvas{display:block;width:100%;height:auto;background:#e9c98f;border:2px solid #9b7444;border-radius:18px;box-shadow:inset 0 0 28px #9b744433,0 5px 18px #5b3b1e22;touch-action:none}.help{text-align:center;font-size:12px;opacity:.72;margin:8px}.overlay{position:fixed;inset:0;background:#2a1b10aa;display:none;align-items:center;justify-content:center;padding:25px}.card{background:#fff8e8;border-radius:22px;padding:24px;text-align:center;max-width:330px;width:100%;box-shadow:0 20px 50px #0005}.card h2{margin:0 0 10px;font-size:28px}.big{font-size:20px;font-weight:800;margin:12px}.card button{width:100%;margin-top:8px;background:#6f9b62;color:white;border:0}.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:8px}.seg .on{background:#6f9b62;color:#fff;border-color:#6f9b62}
</style></head><body><main><div class="top"><div><h1>🧩 朝の木工パズル</h1><div class="sub">好きなハマり方でOK。</div></div><div class="stats"><span class="pill" id="time">0:00</span><span class="pill" id="moves">0手</span></div></div><div class="seg"><button data-d="5">やさしい</button><button data-d="7" class="on">ふつう</button><button data-d="9">むずかしい</button></div><div class="toolbar"><button id="new">🎲 新しい問題</button><button id="reset">↩︎ リセット</button><button id="hint">💡 ヒント</button></div><canvas id="c" width="720" height="1040"></canvas><div class="help">指で移動・タップで90°回転。枠内の空いている場所ならどこでも置ける。全部埋まれば正解！</div></main><div class="overlay" id="ov"><div class="card"><h2>完成！🎉</h2><div class="big" id="result"></div><div id="streak"></div><button id="again">もう1問いく</button></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height,C=62,OX=143,OY=105,dirs=[[1,0],[-1,0],[0,1],[0,-1]];let n=7,pieces=[],shape=[],shapeSet=new Set(),drag=null,moves=0,start=0,timer=null,seed=0,initial=[];
function rng(){seed|=0;seed=seed+0x6D2B79F5|0;let t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}function key(a,b){return a+','+b}function rotCell(q,r){let[a,b]=q;for(let i=0;i<r;i++)[a,b]=[-b,a];return[a,b]}function rotated(p,r=p.r){let a=p.cells.map(q=>rotCell(q,r)),mx=Math.min(...a.map(q=>q[0])),my=Math.min(...a.map(q=>q[1]));return a.map(q=>[q[0]-mx,q[1]-my])}function shapeSig(a){return a.map(q=>key(...q)).sort().join('|')}function uniqueRotations(p){let out=[],seen=new Set;for(let r=0;r<4;r++){let a=rotated(p,r),s=shapeSig(a);if(!seen.has(s)){seen.add(s);out.push(r)}}return out}
function generate(){seed=(Date.now()^Math.random()*1e9)|0;let target=n*4,S=new Set(['3,3']);while(S.size<target){let arr=[...S],q=arr[Math.floor(rng()*arr.length)].split(',').map(Number),d=dirs[Math.floor(rng()*4)],a=q[0]+d[0],b=q[1]+d[1];if(a>=0&&a<7&&b>=0&&b<7)S.add(key(a,b))}shape=[...S].map(s=>s.split(',').map(Number));shapeSet=new Set(shape.map(q=>key(...q)));let seeds=[];while(seeds.length<n){let q=shape[Math.floor(rng()*shape.length)];if(!seeds.some(z=>z[0]==q[0]&&z[1]==q[1]))seeds.push(q)}let groups=seeds.map(q=>[q]),owner=new Map(seeds.map((q,i)=>[key(...q),i]));while(owner.size<shape.length){let progress=false;for(let i=0;i<n;i++){let cand=[];for(let q of groups[i])for(let d of dirs){let k=key(q[0]+d[0],q[1]+d[1]);if(S.has(k)&&!owner.has(k))cand.push([q[0]+d[0],q[1]+d[1]])}if(cand.length){let q=cand[Math.floor(rng()*cand.length)];owner.set(key(...q),i);groups[i].push(q);progress=true}}if(!progress)break}pieces=groups.map((g,i)=>{let minx=Math.min(...g.map(q=>q[0])),miny=Math.min(...g.map(q=>q[1]));return{cells:g.map(q=>[q[0]-minx,q[1]-miny]),r:Math.floor(rng()*4),x:45+(i%3)*225+rng()*25,y:620+Math.floor(i/3)*135+rng()*18,placed:false,gx:null,gy:null,col:`hsl(${25+i*17} 55% ${55+(i%2)*7}%)`}});initial=pieces.map(p=>({x:p.x,y:p.y,r:p.r}));restartClock();draw()}
function restartClock(){clearInterval(timer);start=Date.now();timer=setInterval(tick,250);moves=0;document.getElementById('moves').textContent='0手';document.getElementById('ov').style.display='none'}
function reset(){pieces.forEach((p,i)=>Object.assign(p,initial[i],{placed:false,gx:null,gy:null}));restartClock();draw()}
function pathPiece(p,px=p.x,py=p.y,r=p.r){x.beginPath();for(let q of rotated(p,r))x.rect(px+q[0]*C,py+q[1]*C,C,C)}function draw(){x.clearRect(0,0,W,H);x.save();x.fillStyle='#6f4e2f';x.font='bold 24px -apple-system';x.fillText('この枠を全部埋めよう',OX,62);x.fillStyle='#f7ead0';x.strokeStyle='#7e5b35';x.lineWidth=5;x.beginPath();for(let q of shape)x.rect(OX+q[0]*C,OY+q[1]*C,C,C);x.fill();x.stroke();x.strokeStyle='#b9956255';x.lineWidth=1;for(let q of shape)x.strokeRect(OX+q[0]*C,OY+q[1]*C,C,C);for(let p of pieces.filter(p=>p.placed))paint(p);for(let p of pieces.filter(p=>!p.placed))paint(p);x.restore()}
function paint(p){pathPiece(p);x.fillStyle=p.col;x.shadowColor='#55371955';x.shadowBlur=p.placed?2:9;x.shadowOffsetY=p.placed?1:5;x.fill();x.shadowColor='transparent';x.strokeStyle='#674725';x.lineWidth=3;x.stroke();for(let q of rotated(p)){let g=x.createLinearGradient(p.x+q[0]*C,p.y+q[1]*C,p.x+(q[0]+1)*C,p.y+(q[1]+1)*C);g.addColorStop(0,'#ffffff22');g.addColorStop(1,'#5b351522');x.fillStyle=g;x.fillRect(p.x+q[0]*C+4,p.y+q[1]*C+4,C-8,C-8)}}function point(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}function hit(p,a,b){pathPiece(p);return x.isPointInPath(a,b)}
function occupied(except){let s=new Set;for(let p of pieces)if(p.placed&&p!==except)for(let q of rotated(p))s.add(key(p.gx+q[0],p.gy+q[1]));return s}function validAt(p,gx,gy){let occ=occupied(p);for(let q of rotated(p)){let k=key(gx+q[0],gy+q[1]);if(!shapeSet.has(k)||occ.has(k))return false}return true}function tryPlace(p){let gx=Math.round((p.x-OX)/C),gy=Math.round((p.y-OY)/C);if(validAt(p,gx,gy)){p.gx=gx;p.gy=gy;p.x=OX+gx*C;p.y=OY+gy*C;p.placed=true;navigator.vibrate?.(25);return true}return false}function complete(){if(!pieces.every(p=>p.placed))return false;let occ=occupied(null);return occ.size===shapeSet.size&&[...shapeSet].every(k=>occ.has(k))}
function pick(e){e.preventDefault();let[a,b]=point(e);for(let i=pieces.length-1;i>=0;i--){let p=pieces[i];if(hit(p,a,b)){if(p.placed){p.placed=false;p.gx=p.gy=null}pieces.splice(i,1);pieces.push(p);drag={p,dx:a-p.x,dy:b-p.y,sx:a,sy:b,moved:false};c.setPointerCapture?.(e.pointerId);draw();break}}}c.addEventListener('pointerdown',pick);c.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();let[a,b]=point(e);if(Math.hypot(a-drag.sx,b-drag.sy)>10)drag.moved=true;drag.p.x=a-drag.dx;drag.p.y=b-drag.dy;draw()});c.addEventListener('pointerup',e=>{if(!drag)return;e.preventDefault();let p=drag.p;if(!drag.moved){let rots=uniqueRotations(p),idx=rots.indexOf(p.r);p.r=rots[(idx+1)%rots.length];moves++}else{moves++;tryPlace(p)}document.getElementById('moves').textContent=moves+'手';drag=null;draw();if(complete())done()});c.addEventListener('pointercancel',()=>{drag=null;draw()});
function tick(){let s=Math.floor((Date.now()-start)/1000);document.getElementById('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function done(){clearInterval(timer);let s=Math.floor((Date.now()-start)/1000),d=new Date().toLocaleDateString('sv-SE'),last=localStorage.lastDay||'',st=+(localStorage.streak||0);if(last!==d){let y=new Date(Date.now()-86400000).toLocaleDateString('sv-SE');st=last===y?st+1:1;localStorage.streak=st;localStorage.lastDay=d}document.getElementById('result').textContent=`${Math.floor(s/60)}分${s%60}秒・${moves}手`;document.getElementById('streak').textContent=`🔥 連続 ${st}日`;document.getElementById('ov').style.display='flex'}
document.getElementById('new').onclick=generate;document.getElementById('reset').onclick=reset;document.getElementById('again').onclick=generate;document.getElementById('hint').onclick=()=>{let p=pieces.find(p=>!p.placed);if(!p)return;for(let r of uniqueRotations(p)){p.r=r;for(let gy=0;gy<7;gy++)for(let gx=0;gx<7;gx++)if(validAt(p,gx,gy)){p.gx=gx;p.gy=gy;p.x=OX+gx*C;p.y=OY+gy*C;p.placed=true;moves++;document.getElementById('moves').textContent=moves+'手';draw();if(complete())done();return}}};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-d]').forEach(z=>z.classList.remove('on'));b.classList.add('on');n=+b.dataset.d;generate()});generate();
</script></body></html>
