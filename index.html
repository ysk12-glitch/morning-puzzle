<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ead4a8"><title>朝の木工パズル</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#ead4a8;color:#3e2a19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 5px env(safe-area-inset-bottom)}main{max-width:520px;height:100%;margin:auto;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:18px;margin:0}.sub{font-size:9px;opacity:.68}.stats,.row{display:flex;gap:4px}.pill,button{border:1px solid #b58b55;background:#fff8e8;color:#3e2a19;border-radius:10px;font-weight:700}.pill{padding:4px 7px;font-size:11px}.row{margin:2px 0}.row button{flex:1;min-height:31px;font-size:11px;padding:4px 2px}.on{background:#719766!important;color:#fff!important}.board{flex:1;min-height:0;margin-top:2px;display:flex}canvas{display:block;width:100%;height:100%;background:#e6c483;border:2px solid #906b3f;border-radius:14px;touch-action:none}.help{text-align:center;font-size:9px;opacity:.7;margin:2px}.overlay{position:fixed;inset:0;background:#20150dcc;display:none;align-items:center;justify-content:center;padding:25px;z-index:10}.card{background:#fff8e8;border-radius:20px;padding:22px;text-align:center;max-width:340px;width:100%}.card button{width:100%;padding:10px;background:#719766;color:#fff}.big{font-size:20px;font-weight:800;white-space:pre-line;margin:8px}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#3e2a19;color:#fff8e8;padding:9px 13px;border-radius:13px;font-weight:800;opacity:0;pointer-events:none;z-index:20}.toast.show{opacity:1}</style></head><body><main><div class="top"><div><h1>🧩 朝の木工パズル</h1><div class="sub" id="sub">何ができるかは完成まで秘密</div></div><div class="stats"><span class="pill" id="time">0:00</span><span class="pill" id="moves">0手</span></div></div><div class="row"><button data-mode="shape" class="on">🪵 なぞシルエット</button><button data-mode="photo">🌍 世界の風景</button><button id="sound">🔇 BGM</button></div><div class="row"><button data-d="easy">やさしい</button><button data-d="normal" class="on">ふつう</button><button data-d="hard">むずかしい</button></div><div class="row"><button id="new">🎲 新しい問題</button><button id="reset">↩︎ リセット</button><button id="hint">💡 ヒント</button></div><div class="board"><canvas id="c" width="720" height="820"></canvas></div><div class="help" id="help">パーツを動かして正体を当てよう。タップで90°回転。</div></main><div class="overlay" id="ov"><div class="card"><h2>できた！🎉</h2><div class="big" id="result"></div><div id="fact"></div><button id="again">もう1問いく</button></div></div><div class="toast" id="toast"></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let mode='shape',diff='normal',pieces=[],drag=null,moves=0,start=0,timer,current,initial=[],hintUntil=0,lastShape=-1,lastPhoto=-1,bgmOn=false;
const SHAPES=[
{name:'ネコ',emoji:'🐈',p:[[210,315],[210,235],[250,190],[270,120],[315,175],[380,170],[430,120],[450,205],[485,245],[480,330],[430,385],[350,405],[275,385]],cut:[[330,170,330,405],[210,285,480,285],[390,170,390,405]]},
{name:'ロケット',emoji:'🚀',p:[[350,105],[405,170],[425,285],[480,355],[420,345],[390,410],[350,365],[310,410],[280,345],[220,355],[275,285],[295,170]],cut:[[350,105,350,365],[285,260,415,260],[300,335,405,335]]},
{name:'フクロウ',emoji:'🦉',p:[[250,170],[295,120],[350,165],[405,120],[450,170],[465,265],[430,370],[350,410],[270,370],[235,265]],cut:[[350,165,350,410],[245,255,455,255],[285,345,415,345]]},
{name:'北海道',emoji:'🗾',p:[[245,155],[315,175],[350,135],[390,185],[455,195],[430,245],[485,285],[420,315],[405,375],[345,350],[300,400],[265,350],[215,325],[245,270],[205,220]],cut:[[285,170,300,390],[390,180,365,370],[225,275,470,275]]},
{name:'恐竜',emoji:'🦖',p:[[185,320],[225,260],[285,245],[330,195],[390,205],[420,160],[455,175],[435,230],[485,270],[445,300],[395,285],[365,335],[405,390],[350,385],[325,335],[270,350],[235,405],[210,395],[225,345]],cut:[[270,245,270,355],[350,200,350,385],[220,310,455,310]]}
];
const PHOTOS=[{name:'モン・サン＝ミシェル',emoji:'🇫🇷',url:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/1001_Mont-Saint-Michel_reflecting_in_the_water_Photo_by_Giles_Laurent.jpg/960px-1001_Mont-Saint-Michel_reflecting_in_the_water_Photo_by_Giles_Laurent.jpg'},{name:'マチュ・ピチュ',emoji:'🇵🇪',url:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Panoramic_view_of_Machu_Picchu.jpg/960px-Panoramic_view_of_Machu_Picchu.jpg'},{name:'富士山',emoji:'🇯🇵',url:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Mount_Fuji_from_Lake_Kawaguchi.jpg/960px-Mount_Fuji_from_Lake_Kawaguchi.jpg'}];
function path(p){g.beginPath();g.moveTo(...p[0]);for(let i=1;i<p.length;i++)g.lineTo(...p[i]);g.closePath()}function area(p){let a=0;for(let i=0;i<p.length;i++){let q=p[i],r=p[(i+1)%p.length];a+=q[0]*r[1]-r[0]*q[1]}return a/2}function cen(p){let A=area(p),x=0,y=0;for(let i=0;i<p.length;i++){let q=p[i],r=p[(i+1)%p.length],k=q[0]*r[1]-r[0]*q[1];x+=(q[0]+r[0])*k;y+=(q[1]+r[1])*k}return[x/(6*A),y/(6*A)]}function clip(poly,x1,y1,x2,y2,side){let out=[],dx=x2-x1,dy=y2-y1;function v(q){return dx*(q[1]-y1)-dy*(q[0]-x1)}for(let i=0;i<poly.length;i++){let a=poly[i],b=poly[(i+1)%poly.length],va=v(a),vb=v(b),ia=side?va>=0:va<=0,ib=side?vb>=0:vb<=0;if(ia)out.push(a);if(ia!==ib){let t=va/(va-vb);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}return out}function split(poly,l){let A=clip(poly,...l,true),B=clip(poly,...l,false);return[A,B].filter(p=>p.length>2&&Math.abs(area(p))>500)}function partsFor(s,n){let ps=[s.p.map(q=>[...q])];for(const l of s.cut){if(ps.length>=n)break;let best=-1,ba=0;ps.forEach((p,i)=>{let a=Math.abs(area(p));if(a>ba){ba=a;best=i}});let z=split(ps[best],l);if(z.length===2)ps.splice(best,1,...z)}while(ps.length<n){let best=ps.reduce((m,p,i)=>Math.abs(area(p))>Math.abs(area(ps[m]))?i:m,0),p=ps[best],cc=cen(p),ang=Math.random()*Math.PI,dx=Math.cos(ang)*500,dy=Math.sin(ang)*500,z=split(p,[cc[0]-dx,cc[1]-dy,cc[0]+dx,cc[1]+dy]);if(z.length===2&&z.every(x=>Math.abs(area(x))>1800))ps.splice(best,1,...z);else break}return ps}
function make(){clearInterval(timer);moves=0;document.getElementById('moves').textContent='0手';start=Date.now();document.getElementById('time').textContent='0:00';document.getElementById('ov').style.display='none';if(mode==='shape')makeShape();else makePhoto();timer=setInterval(clock,250)}function clock(){let s=Math.floor((Date.now()-start)/1000);document.getElementById('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function makeShape(){let opts=SHAPES.map((_,i)=>i).filter(i=>i!==lastShape),ix=opts[Math.floor(Math.random()*opts.length)];lastShape=ix;current={...SHAPES[ix],type:'shape'};let n=diff==='easy'?5:diff==='normal'?7:9,ps=partsFor(current,n);build(ps)}function makePhoto(){let opts=PHOTOS.map((_,i)=>i).filter(i=>i!==lastPhoto),ix=opts[Math.floor(Math.random()*opts.length)];lastPhoto=ix;current={...PHOTOS[ix],type:'photo',p:[[150,125],[570,125],[570,390],[150,390]]};let im=new Image;im.onload=()=>{current.img=im;let n=diff==='easy'?6:diff==='normal'?8:10,ps=[current.p];while(ps.length<n){let k=ps.reduce((m,p,i)=>Math.abs(area(p))>Math.abs(area(ps[m]))?i:m,0),p=ps[k],cc=cen(p),ang=Math.random()*Math.PI,dx=Math.cos(ang)*600,dy=Math.sin(ang)*600,z=split(p,[cc[0]-dx,cc[1]-dy,cc[0]+dx,cc[1]+dy]);if(z.length===2)ps.splice(k,1,...z);else break}build(ps)};im.onerror=()=>{toast('写真を読み込めませんでした');mode='shape';make()};im.src=current.url}
function build(ps){let colors=['#9b6848','#c27b54','#e0a477','#b85e43','#d98d62','#8b5b43','#edb582','#aa6d50','#cf8059'];pieces=ps.map((poly,i)=>{let cc=cen(poly);return{local:poly.map(q=>[q[0]-cc[0],q[1]-cc[1]]),target:cc,x:0,y:0,a:0,col:colors[i%colors.length],placed:false}});scatter();initial=pieces.map(p=>({x:p.x,y:p.y,a:p.a}));draw()}
function scatter(){let cols=pieces.length<=6?3:4,rows=Math.ceil(pieces.length/cols);pieces.forEach((p,i)=>{let col=i%cols,row=Math.floor(i/cols);p.x=85+col*(550/(cols-1||1))+(Math.random()-.5)*35;p.y=515+row*(245/Math.max(1,rows-1))+(Math.random()-.5)*25;p.a=Math.floor(Math.random()*4)*90})}
function trans(p,x=p.x,y=p.y,a=p.a){let r=a*Math.PI/180,cs=Math.cos(r),sn=Math.sin(r);return p.local.map(q=>[x+q[0]*cs-q[1]*sn,y+q[0]*sn+q[1]*cs])}function bounds(p){return{minX:Math.min(...p.map(q=>q[0])),maxX:Math.max(...p.map(q=>q[0])),minY:Math.min(...p.map(q=>q[1])),maxY:Math.max(...p.map(q=>q[1]))}}function imageAt(){let b=bounds(current.p),iw=current.img.naturalWidth,ih=current.img.naturalHeight,tw=b.maxX-b.minX,th=b.maxY-b.minY,sc=Math.max(tw/iw,th/ih),sw=tw/sc,sh=th/sc;g.drawImage(current.img,(iw-sw)/2,(ih-sh)/2,sw,sh,b.minX,b.minY,tw,th)}
function draw(){g.clearRect(0,0,720,820);g.textAlign='center';g.fillStyle='#6f4e2f';g.font='bold 21px -apple-system';if(mode==='shape')g.fillText('❓ 何ができる？',360,48);else g.fillText(current?current.emoji+' '+current.name:'🌍 世界の風景',360,48);if(mode==='shape'&&Date.now()<hintUntil){g.save();g.globalAlpha=.16;path(current.p);g.fillStyle='#fff8df';g.fill();g.strokeStyle='#6f4e2f';g.lineWidth=6;g.stroke();g.restore()}if(mode==='photo'&&current?.img){g.save();g.globalAlpha=.14;path(current.p);g.clip();imageAt();g.restore();path(current.p);g.strokeStyle='#755333';g.lineWidth=6;g.stroke()}pieces.forEach(p=>paint(p))}
function paint(p){let q=trans(p);g.save();path(q);g.clip();if(mode==='photo'&&current.img){let r=p.a*Math.PI/180;g.translate(p.x,p.y);g.rotate(r);g.translate(-p.target[0],-p.target[1]);imageAt()}else{g.fillStyle=p.col;g.fillRect(0,0,720,820)}g.restore();path(q);g.strokeStyle=p.placed?'#426d43':'#654527';g.lineWidth=p.placed?7:4;g.stroke()}
function inside(poly,x,y){let z=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let a=poly[i],b=poly[j];if(((a[1]>y)!=(b[1]>y))&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])z=!z}return z}function pt(e){let r=c.getBoundingClientRect();return[(e.clientX-r.left)*720/r.width,(e.clientY-r.top)*820/r.height]}c.onpointerdown=e=>{e.preventDefault();let[x,y]=pt(e);for(let i=pieces.length-1;i>=0;i--){let p=pieces[i];if(inside(trans(p),x,y)){p.placed=false;pieces.splice(i,1);pieces.push(p);drag={p,dx:x-p.x,dy:y-p.y,sx:x,sy:y,m:false};break}}};c.onpointermove=e=>{if(!drag)return;e.preventDefault();let[x,y]=pt(e);if(Math.hypot(x-drag.sx,y-drag.sy)>9)drag.m=true;drag.p.x=x-drag.dx;drag.p.y=y-drag.dy;draw()};c.onpointerup=()=>{if(!drag)return;let p=drag.p;if(!drag.m)p.a=(p.a+90)%360;snap(p);moves++;document.getElementById('moves').textContent=moves+'手';drag=null;draw();check()};function snap(p){let d=Math.hypot(p.x-p.target[0],p.y-p.target[1]),a=((p.a%360)+360)%360,tol=diff==='easy'?42:diff==='normal'?34:27;if(d<tol&&a===0){p.x=p.target[0];p.y=p.target[1];p.a=0;p.placed=true;navigator.vibrate?.(18);toast('カチッ！')}}function check(){if(!pieces.length||!pieces.every(p=>p.placed))return;clearInterval(timer);let s=Math.floor((Date.now()-start)/1000);document.getElementById('result').textContent=(current.emoji||'✨')+' '+current.name+'！\n'+s+'秒・'+moves+'手';document.getElementById('fact').textContent=mode==='shape'?'この形だったのか！':'風景完成！';document.getElementById('ov').style.display='flex'}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1200)}document.getElementById('hint').onclick=()=>{if(mode==='shape'){hintUntil=Date.now()+1800;toast('1.8秒だけシルエット表示');draw();setTimeout(draw,1850)}else toast('薄い完成写真がヒントだよ')};document.getElementById('reset').onclick=()=>{pieces.forEach((p,i)=>Object.assign(p,initial[i],{placed:false}));moves=0;start=Date.now();draw()};document.getElementById('new').onclick=make;document.getElementById('again').onclick=make;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-d]').forEach(x=>x.classList.remove('on'));b.classList.add('on');diff=b.dataset.d;make()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;document.getElementById('sub').textContent=mode==='shape'?'何ができるかは完成まで秘密':'風景写真を元に戻す';document.getElementById('help').textContent=mode==='shape'?'パーツを動かして正体を当てよう。タップで90°回転。':'写真のつながりを見て復元。タップで90°回転。';make()});const bgm=new Audio('Clear_Pallet.mp3');bgm.loop=true;bgm.preload='auto';bgm.volume=.5;document.getElementById('sound').onclick=async()=>{bgmOn=!bgmOn;if(bgmOn){try{await bgm.play();sound.textContent='🔊 BGM'}catch(e){bgmOn=false}}else{bgm.pause();sound.textContent='🔇 BGM'}};make();
</script></body></html>
